    /* ============================== PROMPTS ============================== */
    // O marcador {{IDEIA}} é substituído pelo texto que você digitar.

    const PROMPT_MAE = {
      id:'mae',
      titulo:'⭐ Prompt-mãe — Registrar nova ideia',
      desc:'O principal. Use sempre que tiver uma ideia nova: ele organiza, aprofunda e classifica de uma vez.',
      texto:
`Ely, estou registrando uma nova ideia para minha Central de Ideias.
Quero que você organize, aprofunde e classifique essa ideia.
Analise nos seguintes pontos:
1. Tema central;
2. Categoria mais adequada;

Minha ideia é: {{IDEIA}}`
    };

    const PROMPTS = [
      {
        id:'p01', titulo:'01 — Organizar ideia solta', fase:'Fase 1 · Captura',
        desc:'Para quando você tem uma ideia solta (áudio ou pensamento inicial) e quer organizá-la.',
        texto:
`Ely, organize essa ideia em formato estratégico.
Quero que você identifique:
1. Qual é o tema central;
2. Qual problema essa ideia resolve;
3. Para qual público ela serve;
4. Quais são os possíveis desdobramentos;
5. Se ela pode virar palestra, aula, post, mentoria, produto, e-book ou proposta comercial.

Ideia: {{IDEIA}}`
      },
      {
        id:'p02', titulo:'02 — Aprofundar tema', fase:'Fase 2 · Pesquisa',
        desc:'Para transformar a ideia em pesquisa e desenvolvimento de conteúdo autoral.',
        texto:
`Ely, aprofunde esse tema como se fosse uma pesquisa para desenvolvimento de conteúdo autoral.
Traga:
1. Conceito principal;
2. Origem ou base teórica;
3. Principais autores ou referências;
4. Aplicação prática para empresários, líderes ou equipes;
5. Conexões com psicologia, comportamento, gestão e fé cristã, quando fizer sentido;
6. Possíveis frases fortes;
7. Ideias de conteúdo derivado.

Tema: {{IDEIA}}`
      },
      {
        id:'p03', titulo:'03 — Transformar em estrutura', fase:'Fase 3 · Estrutura',
        desc:'Quando a ideia já está boa e precisa virar uma estrutura de conteúdo.',
        texto:
`Ely, transforme esse tema em uma estrutura completa de conteúdo.
Quero que você me entregue:
1. Título principal;
2. Subtítulo;
3. Objetivo do conteúdo;
4. Público-alvo;
5. Estrutura em tópicos;
6. Introdução impactante;
7. Desenvolvimento em blocos;
8. Conclusão com chamada à ação;
9. Possíveis formatos: palestra, aula, carrossel, e-book, vídeo ou mentoria.

Tema: {{IDEIA}}`
      },
      {
        id:'p04', titulo:'04 — Transformar em palestra / aula', fase:'Fase 4 · Conteúdo final',
        desc:'Para montar a estrutura de uma apresentação, curso, mentoria ou treinamento.',
        camposExtras:[
          {chave:'PUBLICO', rotulo:'Público', placeholder:'ex.: líderes, empresários, equipe...'},
          {chave:'TEMPO',   rotulo:'Tempo disponível', placeholder:'ex.: 45 minutos, 2 horas...'},
          {chave:'TOM',     rotulo:'Tom', placeholder:'profissional, espiritual, emocional, corporativo, provocativo...'},
        ],
        texto:
`Ely, transforme essa estrutura em uma palestra/aula com linguagem profunda, didática e elegante.
Quero uma abertura forte, desenvolvimento por blocos, exemplos práticos, frases de impacto e conclusão memorável.
O público será: {{PUBLICO}}.
O tempo disponível será: {{TEMPO}}.
O tom deve ser: {{TOM}}.

Tema: {{IDEIA}}`
      },
      {
        id:'p05', titulo:'05 — Transformar em conteúdo para Instagram', fase:'Fase 4 · Conteúdo final',
        desc:'Para Instagram: legenda, stories, reels, carrossel e frase de impacto.',
        texto:
`Ely, transforme essa ideia em conteúdo para Instagram.
Crie:
1. Uma legenda profunda e envolvente;

Tema: {{IDEIA}}`
      },
      {
        id:'p06', titulo:'06 — Transformar em material institucional', fase:'Aplicação',
        desc:'Para Grupo Palin, IntegraMente, cultura organizacional e propostas comerciais.',
        texto:
`Ely, transforme esse tema em material institucional alinhado à minha marca.
Quero que você entregue:
1. Posicionamento e mensagem central;
2. Texto institucional elegante e profissional;

5. Estrutura de uma proposta comercial (problema, solução, entregáveis, diferenciais);
6. Tom de autoridade, confiança e cuidado humano.

Tema: {{IDEIA}}`
      },
      {
        id:'p07', titulo:'07 — Conectar com fé cristã', fase:'Aplicação',
        desc:'Para conteúdos devocionais, propósito e princípios bíblicos.',
        texto:
`Ely, conecte esse tema com a fé cristã de forma profunda, respeitosa e fundamentada.
Quero que você traga:
1. Princípio bíblico central relacionado ao tema;
2. Referências e passagens que sustentam a reflexão;
3. Aplicação prática para a vida, a liderança e o propósito;
4. Um devocional curto (abertura, reflexão e oração);
5. Uma frase de impacto com base espiritual;
6. Ponte entre fé, comportamento humano e cultura.

Tema: {{IDEIA}}`
      },
      {
        id:'p08', titulo:'08 — Transformar em produto', fase:'Aplicação',
        desc:'Para criar mentoria, método, e-book, evento ou programa.',
        texto:
`Ely, transforme essa ideia em um produto estruturado.
Quero que você defina:
1. Nome e promessa central do produto;
2. Formato (mentoria, método, e-book, curso, evento ou programa);
3. Público-alvo e dor que resolve;
4. Estrutura de módulos ou etapas;
5. Transformação prometida (antes e depois);
6. Possível precificação e entregáveis;

8. Próximos passos para tirar do papel.

Tema: {{IDEIA}}`
      },
    ];

    /* ============================== STORAGE ============================== */

    const LS_KEY = 'central_ideias_jessica_v1';
    const carregar = () => {
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
      catch { return []; }
    };
    const salvar = (ideias) => localStorage.setItem(LS_KEY, JSON.stringify(ideias));
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

    const LS_LIVROS = 'central_ideias_livros_v1';
    const carregarLivros = () => { try { return JSON.parse(localStorage.getItem(LS_LIVROS)) || []; } catch { return []; } };
    const salvarLivros = (l) => { try { localStorage.setItem(LS_LIVROS, JSON.stringify(l)); } catch(e){ console.warn('Não foi possível salvar (limite de armazenamento atingido — tente uma imagem de capa menor).', e); } };
    const contarPalavras = (t) => (t||'').trim() ? t.trim().split(/\s+/).length : 0;

    const LS_REFS = 'central_ideias_referencias_v1';
    const carregarRefs = () => { try { return JSON.parse(localStorage.getItem(LS_REFS)) || []; } catch { return []; } };
    const salvarRefs = (r) => { try { localStorage.setItem(LS_REFS, JSON.stringify(r)); } catch(e){ console.warn('Não foi possível salvar referências (limite de armazenamento).', e); } };
    const citacaoRef = (r) => {
      const p = [];
      if (r.autor) p.push(r.autor.toUpperCase().replace(/\.+$/,'') + '.');
      if (r.titulo) p.push(r.titulo + '.');
      if (r.fonte) p.push(r.fonte + '.');
      if (r.ano) p.push(String(r.ano) + '.');
      let s = p.join(' ').trim();
      if (r.link) s += (s ? ' ' : '') + 'Disponível em: ' + r.link;
      return s || r.titulo || '(referência sem dados)';
    };

    const formatarTamanho = (b) => {
      if (!b && b!==0) return '';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(0) + ' KB';
      return (b/1048576).toFixed(1) + ' MB';
    };

    /* anexos em IndexedDB (suporta arquivos grandes, ex.: PDFs) */
    const DB_NAME = 'central_ideias_db', STORE_ANEXOS = 'anexos';
    let _dbp;
    const idb = () => _dbp || (_dbp = new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE_ANEXOS)) req.result.createObjectStore(STORE_ANEXOS); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }));
    const idbSet = async (key, val) => { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE_ANEXOS,'readwrite'); tx.objectStore(STORE_ANEXOS).put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); };
    const idbGet = async (key) => { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE_ANEXOS,'readonly'); const r = tx.objectStore(STORE_ANEXOS).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); };
    const idbDel = async (key) => { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE_ANEXOS,'readwrite'); tx.objectStore(STORE_ANEXOS).delete(key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); };
    const abrirAnexo = async (anexo, onErro) => {
      try {
        const blob = await idbGet(anexo.id);
        if (!blob) { onErro && onErro(); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch { onErro && onErro(); }
    };

    const lerImagemRedimensionada = (file, maxW=1000) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, maxW / img.width);
          const w = Math.round(img.width*escala), h = Math.round(img.height*escala);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const hojeISO = () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    };

    const emDias = (n) => {
      const d = new Date(); d.setDate(d.getDate()+n);
      const p = (x) => String(x).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    };

    const formatarData = (iso) => {
      if (!iso) return '';
      const [y,m,d] = iso.split('-');
      return `${d}/${m}/${y}`;
    };
    const legacyReflexoes = (notas) => {
      const out = []; const re = /—\s*Reflex[ãa]o\s*\(([^)]+)\):\s*([^\n]+)/g; let m;
      while ((m = re.exec(notas||''))) out.push({ data:m[1], texto:m[2].trim() });
      return out;
    };
    const getReflexoes = (i) => [ ...(i.reflexoes||[]).map(r=>({data:formatarData(r.data), texto:r.texto})), ...legacyReflexoes(i.notas) ];
    const diffDias = (iso) => {
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const [y,m,d] = iso.split('-').map(Number);
      const alvo = new Date(y, m-1, d); alvo.setHours(0,0,0,0);
      return Math.round((alvo - hoje) / 86400000);
    };
    const rotuloPrazo = (iso) => {
      const n = diffDias(iso);
      if (n < 0)  return { txt:`Atrasado ${-n}d`, cor:'bg-red-100 text-red-700 ring-red-300' };
      if (n === 0) return { txt:'Hoje',   cor:'bg-amber-100 text-amber-800 ring-amber-300' };
      if (n === 1) return { txt:'Amanhã', cor:'bg-amber-100 text-amber-800 ring-amber-300' };
      if (n <= 7)  return { txt:`Em ${n} dias`, cor:'bg-blue-100 text-blue-800 ring-blue-300' };
      return { txt:`Em ${n} dias`, cor:'bg-stone-100 text-stone-600 ring-stone-300' };
    };
    const escICS = (s) => String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
    const icsDeIdeia = (ideia) => {
      const d = (ideia.prazo || hojeISO()).replace(/-/g,'');
      const resumo = escICS(ideia.proximo || ideia.nome || 'Próximo passo');
      const desc = escICS(`Ideia: ${ideia.nome}` + (ideia.proximo ? ` — ${ideia.proximo}` : ''));
      return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Central de Ideias//PT-BR','CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',`UID:${ideia.id}@central-de-ideias`,
        `DTSTART:${d}T090000`,`DTEND:${d}T093000`,
        `SUMMARY:${resumo}`,`DESCRIPTION:${desc}`,
        'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT30M',`DESCRIPTION:${resumo}`,'END:VALARM',
        'END:VEVENT','END:VCALENDAR'].join('\r\n');
    };

    /* ===== MENTOR (coach que questiona) ===== */
    const PERSONA_SISTEMA = `Você é o "Mentor" da Jéssica, dentro do app pessoal dela (Central de Ideias). Seu papel NÃO é concordar nem agradar — é fazê-la PENSAR e AGIR.

Sobre a Jéssica:
- Temperamento FLEUMÁTICO: tende a evitar conflito, acomodar-se, manter a paz e PROCRASTINAR. Combata isso pedindo compromissos concretos, pequenos e com prazo. Não aceite "depois", "talvez", "quando der".
- Eneagrama TIPO 8: intensa, líder, quer controle e justiça, protege os seus, mas pode endurecer, evitar a própria vulnerabilidade e querer resolver tudo na força. Fale com firmeza (ela não recua de confronto), respeite a força dela, e ao mesmo tempo convide-a a olhar a vulnerabilidade e a não atropelar as pessoas.
- VALOR CENTRAL dela: não desistir das pessoas. Quando ela quiser cortar alguém, faça-a refletir antes — sem ingenuidade.

Como você age:
- Questione mais do que afirma. Faça no máximo 1-2 perguntas fortes por resposta.
- Não a deixe procrastinar: exija o próximo passo concreto, mensurável e com prazo. Aponte as desculpas.
- Traga-a para a realidade: peça fatos e evidências, não suposições. Aponte pontos cegos.
- Discorde quando fizer sentido. Nada de bajulação.
- Seja breve (2 a 6 frases), direto e caloroso. Português do Brasil. Pode chamá-la de Jéssica.
- Ancore no que ela disse e nos dados reais dela. Termine quase sempre com uma pergunta que a obrigue a se posicionar ou agir.`;

    const realityLinha = (ctx) => {
      if (!ctx.atrasados.length) return '';
      const o = ctx.atrasados[0];
      return `📌 Realidade: você tem ${ctx.atrasados.length} próximo(s) passo(s) atrasado(s). O mais antigo — "${o.proximo||o.nome}" — está parado há ${-diffDias(o.prazo)} dias. Qual ação de 15 minutos destrava ele agora?`;
    };
    const realityCheckCompleto = (ctx) => {
      if (!ctx.atrasados.length) return 'Você não tem nenhum próximo passo atrasado agora, Jéssica. Então a pergunta muda: você está sendo ambiciosa o bastante ou só confortável? Qual ideia parada merece um prazo ainda hoje — e qual é ele?';
      const lista = ctx.atrasados.slice(0,5).map(i=>`• ${-diffDias(i.prazo)}d atrás — ${i.proximo||i.nome} (${i.nome})`).join('\n');
      return `Vamos encarar a realidade, sem suavizar:\n\n${lista}\n\nNada disso some sozinho. Escolha UM agora: qual você resolve hoje, e a que horas? Sem "depois".`;
    };
    const _bancosMentor = {
      proc: [
        "Jéssica, \"depois\" é o jeito educado de dizer \"não\". O que você ganha adiando isso — e o que perde? Qual a menor ação que dá pra fazer nos próximos 30 minutos?",
        "Fleumática que é você adora esperar a hora certa. Spoiler: ela não vem. Que passo você se compromete a dar HOJE, com hora marcada?",
        "Você não está sem tempo — está sem decisão. Se isso fosse inegociável, o que faria ainda hoje? Por que não está fazendo?",
        "Cansaço é real, mas também é um ótimo álibi. O que aí é cansaço de verdade e o que é fuga? Diga a próxima ação, pequena e específica.",
      ],
      pessoas: [
        "Antes de fechar a porta: você está reagindo ao que a pessoa fez ou ao que imaginou que ela quis dizer? Que conversa franca ainda não teve com ela?",
        "Como 8, você protege os seus com força — e também cobra demais. O que essa pessoa precisa de você que ainda não recebeu: clareza, limite ou paciência?",
        "Desistir é rápido; formar gente é lento. Se você NÃO desistisse dela, qual seria o próximo passo? O que te custaria tentar mais uma vez, com um limite claro?",
      ],
      desistir: [
        "Você quer desistir disso ou descansar disso? São coisas diferentes. Se amanhã acordasse com energia, ainda largaria?",
        "Cansar faz parte; desistir é decisão. Qual é o motivo real — está difícil, ou está te confrontando com algo que você não quer encarar?",
        "Você não desiste das pessoas. Então por que está pronta a desistir de você nessa? O que mudaria se desse só mais um passo?",
      ],
      medo: [
        "Você não teme o fracasso, Jéssica — teme não ter controle. Onde exatamente está tentando controlar o incontrolável? E se pedisse ajuda?",
        "Mostrar que não sabe não é fraqueza, é dado. Quem poderia te ajudar nisso se você baixasse a guarda? O que te impede?",
        "Que verdade sobre essa situação você está evitando olhar? Diga em uma frase, sem suavizar.",
      ],
      raiva: [
        "Sua intensidade é força quando aponta pro lugar certo. Essa raiva está te movendo ou te queimando? O que ela tenta proteger?",
        "Justiça é sua bandeira, e é legítima. Mas que parte da história você ainda não olhou do outro lado? O que muda se estiver 10% errada?",
        "Bater de frente resolve ou só alivia? O que você realmente quer daqui: vencer a discussão ou mudar a situação?",
      ],
      decisao: [
        "Decidir te assusta menos que errar. Quais são as duas opções, em uma frase cada? E qual você já sabe a resposta, mas não quer admitir?",
        "Se tivesse que decidir nos próximos 10 minutos, o que escolheria? O que esse impulso te diz?",
        "Não decidir já é decidir — a favor do que está aí. É isso que você quer? Qual o custo de adiar mais uma semana?",
      ],
      avanco: [
        "Boa. Agora não pare no aplauso: o que esse avanço te ensina sobre o que você é capaz quando para de adiar? Qual o próximo passo, hoje?",
        "Comemorou? Ótimo. Qual o próximo degrau — e quando? Não deixe a vitória virar pausa longa.",
      ],
      fallback: [
        "Interessante. Me diga: o que você quer de verdade aqui — e o que está te impedindo? Seja específica.",
        "Vou te devolver a pergunta: se fosse 100% honesta consigo mesma, qual é o assunto real por trás disso?",
        "Não vou te dar resposta pronta. Que decisão ou ação essa conversa está pedindo de você? Em uma frase.",
        "O que muda na sua vida se você encarar isso hoje, em vez de \"depois\"? E o que muda se não encarar?",
      ],
    };
    const mentorLocal = (texto, ctx, n) => {
      const t = ' ' + (texto||'').toLowerCase() + ' ';
      const tem = (re) => re.test(t);
      const pick = (arr) => arr[(n||0) % arr.length];
      if (tem(/(prazo|atrasad|reality|me cobr|cobran|minhas ideias|meus prazos)/)) return realityCheckCompleto(ctx);
      if (tem(/(desist|larga|larguei|n[aã]o vale a pena|sem sentido|cortar ela|cortar ele|cansei de tudo)/)) return pick(_bancosMentor.desistir);
      if (tem(/(pessoa|equipe|fulan|decepc|magou|magoou|tra[ií]|n[aã]o confio|sozinh|ningu[eé]m|conflito|briga|cobrar|l[ií]der|s[oó]cio|fam[ií]lia|marido|filh|amig)/)) return pick(_bancosMentor.pessoas);
      if (tem(/(medo|inseg|vergonha|fr[aá]gil|fraqu|vulner|perder o controle|e se der errado|ansiedad)/)) return pick(_bancosMentor.medo);
      if (tem(/(raiva|injust|revolt|irritad|[oó]dio|controlar|do meu jeito|na marra|na for[çc]a)/)) return pick(_bancosMentor.raiva);
      if (tem(/(decid|escolh|n[aã]o sei o que fazer|d[uú]vida|dois caminhos|qual.*melhor|qual.*caminho)/)) return pick(_bancosMentor.decisao);
      if (tem(/(depois|amanh|mais tarde|semana que vem|pregui|sem tempo|ocupad|cansad|n[aã]o comecei|ainda n[aã]o|vou tentar|talvez|qualquer dia|enrol|adiar|adiei|procrastin|deixei pra|deixar pra|sem [aâ]nimo)/)) return pick(_bancosMentor.proc) + (ctx.atrasados.length ? '\n\n'+realityLinha(ctx) : '');
      if (tem(/(consegui|terminei|finalizei|deu certo|avancei|completei|publiquei|conclu[ií]|fiz isso|fiz o)/)) return pick(_bancosMentor.avanco);
      return pick(_bancosMentor.fallback) + (ctx.atrasados.length && (n%2===0) ? '\n\n'+realityLinha(ctx) : '');
    };

    const nomePadronizado = (ideia) => {
      const cat = catById(ideia.categoria).curto;
      const niv = nivelById(ideia.nivel).nome;
      const tema = (ideia.nome || 'Sem título').trim();
      return `${ideia.data || hojeISO()} | ${cat} | ${tema} | ${niv}`;
    };

    const aplicarPrompt = (texto, ideia, extras={}) => {
      let resumo = ideia ? montarResumoIdeia(ideia) : '[colar aqui]';
      let out = texto.replaceAll('{{IDEIA}}', resumo);
      for (const [k,v] of Object.entries(extras)) {
        out = out.replaceAll(`{{${k}}}`, v && v.trim() ? v.trim() : `[${k.toLowerCase()}]`);
      }
      out = out.replace(/\{\{[A-Z]+\}\}/g, (m) => `[${m.slice(2,-2).toLowerCase()}]`);
      return out;
    };

    const montarResumoIdeia = (i) => {
      const partes = [];
      if (i.nome) partes.push(i.nome);
      if (i.problema) partes.push(`Problema que resolve: ${i.problema}`);
      if (i.publico) partes.push(`Público-alvo: ${i.publico}`);
      if (i.formatos && i.formatos.length) partes.push(`Formatos possíveis: ${i.formatos.join(', ')}`);
      if (i.proximo) partes.push(`Próximo passo: ${i.proximo}`);
      return partes.join('. ');
    };

    function useToast() {
      const [msg, setMsg] = useState(null);
      const show = (m) => { setMsg(m); setTimeout(()=>setMsg(null), 2200); };
      const node = msg ? (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-brand-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium" data-anim>
          {msg}
        </div>
      ) : null;
      return [node, show];
    }

    const copiar = async (texto, onOk) => {
      try { await navigator.clipboard.writeText(texto); onOk && onOk(); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = texto; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); onOk && onOk();
      }
    };

      return (
        <div draggable
          onDragStart={()=>onDragStart(ideia.id)}
          onClick={()=>onEditar(ideia)}
          className="bg-white rounded-xl border border-brand-200 p-3 shadow-sm hover:shadow-md hover:border-plum-300 transition cursor-grab active:cursor-grabbing" data-anim>
          <div className="text-[11px] text-brand-500 mb-1">{cat.emoji} {cat.curto}{ideia.projeto?` · 📁 ${ideia.projeto}`:''}</div>
          <h4 className="font-serif text-sm leading-snug text-brand-900 break-words">{ideia.nome}</h4>
          {(ideia.formatos||[]).length>0 &&
            <div className="mt-2 flex flex-wrap gap-1">
              {ideia.formatos.slice(0,3).map(x=><span key={x} className="text-[10px] px-1.5 py-0.5 rounded-full bg-plum-50 text-plum-700 ring-1 ring-plum-200">{x}</span>)}
            </div>}

    function KanbanBoard({ ideias, onEditar, onMover }) {
      const [over, setOver] = useState(null);
      const dragId = useRef(null);
      return (
        <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">
          {NIVEIS.map(n => {
            const cards = ideias.filter(i => i.nivel===n.id);
            return (
              <div key={n.id}
                onDragOver={e=>{ e.preventDefault(); setOver(n.id); }}
                onDragLeave={()=>setOver(o=>o===n.id?null:o)}
                onDrop={()=>{ if(dragId.current) onMover(dragId.current, n.id); dragId.current=null; setOver(null); }}
                className={`rounded-2xl border p-3 min-h-[140px] transition ${over===n.id?'border-plum-400 bg-plum-50 ring-2 ring-plum-200':'border-brand-200 bg-brand-100/40'}`}>
                <div className="flex items-center justify-between mb-3 px-1">
                  <span className="text-xs font-semibold uppercase tracking-wide text-brand-600">{n.nome}</span>
                  <span className="text-xs text-brand-400">{cards.length}</span>
                </div>
                <div className="space-y-3">
                  {cards.map(i => <KanbanCard key={i.id} ideia={i} onEditar={onEditar} onDragStart={(id)=>dragId.current=id} />)}
                  {cards.length===0 && <p className="text-xs text-brand-300 text-center py-4">—</p>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================== FOLHA DE EXPORTAÇÃO ============================== */

    function FolhaImpressao({ ideia:i }) {
      const cat = catById(i.categoria), niv = nivelById(i.nivel);
      const Sec = ({titulo, children}) => children ? (
        <div className="mt-3">
          <div className="text-xs font-semibold uppercase tracking-wide text-brand-500">{titulo}</div>
          <div className="text-sm text-brand-800 whitespace-pre-wrap">{children}</div>
        </div>
      ) : null;
      return (
        <div>
          <div className="text-xs text-brand-500">{cat.emoji} {cat.nome}</div>
          <h1 className="font-serif text-2xl text-brand-900 mt-1">{i.nome}</h1>
          <div className="mt-1 text-sm text-brand-500">{i.projeto?`📁 ${i.projeto} · `:''}{formatarData(i.data)} · {niv.nome}</div>
          <Sec titulo="Público-alvo">{i.publico}</Sec>
          <Sec titulo="Problema que resolve">{i.problema}</Sec>
          <Sec titulo="Formatos possíveis">{(i.formatos||[]).join(', ')}</Sec>
          <Sec titulo="Conexões">{(i.conexoes||[]).join(', ')}</Sec>
          <Sec titulo="Próximo passo">{i.proximo ? `${i.proximo}${i.prazo?`  (prazo: ${formatarData(i.prazo)})`:''}` : ''}</Sec>
          <Sec titulo="Notas">{i.notas}</Sec>
          {(i.reflexoes||[]).length>0 &&
            <div className="mt-3">
              <div className="text-xs font-semibold uppercase tracking-wide text-brand-500">Reflexões</div>
              {(i.reflexoes||[]).map((r,idx)=>(
                <div key={idx} className="text-sm text-brand-800 mt-1">• {r.texto} <span className="text-brand-400">({formatarData(r.data)})</span></div>
              ))}
            </div>}
          <div className="mt-4 pt-3 border-t border-brand-200 text-xs text-brand-400 font-mono">{nomePadronizado(i)}</div>
        </div>
      );
    }

    const textoExport = (i) => {
      const l = [];
      l.push(i.nome, '');
      l.push(`Categoria: ${catById(i.categoria).nome}`);
      if (i.projeto) l.push(`Projeto: ${i.projeto}`);
      l.push(`Nível de maturidade: ${nivelById(i.nivel).nome}`);
      l.push(`Data: ${formatarData(i.data)}`);
      if (i.publico) l.push(`Público-alvo: ${i.publico}`);
      if (i.problema) l.push('', 'Problema que resolve:', i.problema);
      if ((i.formatos||[]).length) l.push('', `Formatos possíveis: ${i.formatos.join(', ')}`);
      if ((i.conexoes||[]).length) l.push(`Conexões: ${i.conexoes.join(', ')}`);
      if (i.proximo) l.push('', `Próximo passo: ${i.proximo}${i.prazo?` (prazo: ${formatarData(i.prazo)})`:''}`);
      if (i.notas) l.push('', 'Notas:', i.notas);
      if ((i.reflexoes||[]).length) { l.push('', 'Reflexões:'); i.reflexoes.forEach(r=>l.push(`• ${r.texto} (${formatarData(r.data)})`)); }
      l.push('', `— ${nomePadronizado(i)}`);
      return l.join('\n');
    };

    /* ============================== BIBLIOTECA DE PROMPTS ============================== */

    function PromptCard({ prompt, ideia, onCopiado }) {
      const [aberto, setAberto] = useState(false);
      const [ideiaTexto, setIdeiaTexto] = useState('');
      const [extras, setExtras] = useState({});

      const ideiaParaUsar = ideia
        ? ideia
        : (ideiaTexto.trim() ? { nome: ideiaTexto } : null);

      const textoFinal = aplicarPrompt(prompt.texto, ideiaParaUsar, extras);

      return (
        <div className="bg-white rounded-2xl border border-brand-200 shadow-sm overflow-hidden" data-anim>
          <button onClick={()=>setAberto(a=>!a)} className="w-full text-left px-5 py-4 flex items-start justify-between gap-3 hover:bg-brand-50/60 transition">
            <div>
              {prompt.fase && <div className="text-[11px] font-semibold uppercase tracking-wide text-plum-600 mb-0.5">{prompt.fase}</div>}
              <h3 className="font-serif text-lg text-brand-900">{prompt.titulo}</h3>
              <p className="text-sm text-brand-600 mt-0.5">{prompt.desc}</p>
            </div>
            <span className={`text-brand-400 transition mt-1 ${aberto?'rotate-180':''}`}>▾</span>
          </button>

          {aberto && (
            <div className="px-5 pb-5 space-y-3 border-t border-brand-100" data-anim>
              {ideia ? (
                <div className="mt-3 text-xs bg-plum-50 border border-plum-200 text-plum-800 rounded-lg px-3 py-2">
                  Usando a ideia selecionada: <strong>{ideia.nome}</strong>
                </div>
              ) : (
                <textarea
                  rows="2"
                  className="mt-3 w-full rounded-xl border border-brand-200 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300"
                  placeholder="Cole ou digite sua ideia aqui..."
                  value={ideiaTexto}
                  onChange={e=>setIdeiaTexto(e.target.value)}
                />
              )}

              {(prompt.camposExtras||[]).map(c => (
                <input key={c.chave}
                  className="w-full rounded-xl border border-brand-200 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300"
                  placeholder={`${c.rotulo}: ${c.placeholder}`}
                  value={extras[c.chave]||''}
                  onChange={e=>setExtras(s=>({...s,[c.chave]:e.target.value}))}
                />
              ))}

              <pre className="whitespace-pre-wrap text-sm text-brand-800 bg-brand-50 border border-brand-200 rounded-xl p-4 font-sans max-h-72 overflow-auto">{textoFinal}</pre>

              <button onClick={()=>copiar(textoFinal, onCopiado)} className="w-full bg-plum-600 hover:bg-plum-700 text-white font-semibold py-2.5 rounded-xl transition">
                Copiar prompt
              </button>
            </div>
          )}
        </div>
      );

    /* ============================== LIVRO / MANUSCRITO ============================== */

    function ManuscritoImpressao({ livro, ideias }) {
      const idById = (id) => ideias.find(i => i.id===id);
      return (
        <div>
          <div className="capa-livro text-center py-6 mb-4 border-b border-brand-200">
            {livro.capa && <img src={livro.capa} alt="Capa" className="mx-auto mb-6 max-h-80 rounded-lg object-contain" />}
            <h1 className="font-serif text-3xl text-brand-900">{livro.titulo || 'Sem título'}</h1>
            {livro.subtitulo && <p className="font-serif text-lg text-brand-600 mt-2">{livro.subtitulo}</p>}
            {livro.autor && <p className="text-sm text-brand-500 mt-4">{livro.autor}</p>}
          </div>
          <div className="quebra-pagina"></div>
          {livro.sinopse && <p className="text-sm text-brand-700 whitespace-pre-wrap mb-6 italic">{livro.sinopse}</p>}
          {livro.capitulos.length>0 &&
            <div className="mb-8">
              <h2 className="font-serif text-xl text-brand-900 mb-2">Sumário</h2>
              <ol className="text-sm text-brand-700 list-decimal pl-5 space-y-1">
                {livro.capitulos.map(c => <li key={c.id}>{c.titulo || '(sem título)'}</li>)}
              </ol>
            </div>}
          {livro.capitulos.map((c,idx) => (
            <div key={c.id} className="mb-7">
              <h2 className="font-serif text-2xl text-brand-900 mb-1">{idx+1}. {c.titulo || '(sem título)'}</h2>
              {c.descricao && <p className="text-sm text-brand-500 italic mb-2">{c.descricao}</p>}
              {c.texto
                ? <p className="text-sm text-brand-800 whitespace-pre-wrap leading-relaxed">{c.texto}</p>
                : <p className="text-sm text-brand-400 italic">(capítulo ainda sem texto — material de apoio: {(c.ideiaIds||[]).map(id=>idById(id)?.nome).filter(Boolean).join('; ') || 'nenhum'})</p>}
            </div>
          ))}
        </div>
      );
    }

    const textoLivro = (livro, ideias) => {
      const idById = (id) => ideias.find(i => i.id===id);
      const l = [];
      l.push((livro.titulo||'Sem título').toUpperCase());
      if (livro.subtitulo) l.push(livro.subtitulo);
      if (livro.autor) l.push(`por ${livro.autor}`);
      l.push('', '');
      if (livro.sinopse) l.push(livro.sinopse, '', '');
      if (livro.capitulos.length) {
        l.push('SUMÁRIO');
        livro.capitulos.forEach((c,i)=> l.push(`${i+1}. ${c.titulo||'(sem título)'}`));
        l.push('', '');
      }
      livro.capitulos.forEach((c,idx) => {
        l.push('', `${idx+1}. ${(c.titulo||'(sem título)').toUpperCase()}`, '');
        if (c.descricao) l.push(c.descricao, '');
        if (c.texto) l.push(c.texto);
        else {
          const apoio = (c.ideiaIds||[]).map(id=>idById(id)?.nome).filter(Boolean).join('; ');
          l.push(`(sem texto — material de apoio: ${apoio||'nenhum'})`);
        }
        l.push('');
      });
      return l.join('\n');
    };

    /* ============================== CAPÍTULO ============================== */

    function CapituloBlock({ cap, idx, total, ideias, onUpd, onRemover, onMover, onAbrirPicker }) {
      const idById = (id) => ideias.find(i => i.id===id);
      const vinculadas = (cap.ideiaIds||[]).map(idById).filter(Boolean);
      const palavras = contarPalavras(cap.texto);
      const campoCls = "w-full rounded-xl border border-brand-200 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300";

      const montarRascunho = () => {
        const partes = [];
        vinculadas.forEach(i => {
          partes.push(`## ${i.nome}`);
          if (i.problema) partes.push(i.problema);
          if (i.notas) partes.push(i.notas);
          partes.push('');
        });
        const rascunho = partes.join('\n').trim();
        if (!rascunho) return;
        if (cap.texto && cap.texto.trim() && !confirm('Acrescentar o rascunho das ideias ao texto já existente?')) return;
        onUpd({ texto: (cap.texto && cap.texto.trim() ? cap.texto.trim()+'\n\n' : '') + rascunho });
      };

      return (
        <details className="bg-white rounded-2xl border border-brand-200 shadow-sm" data-anim>
          <summary className="cursor-pointer list-none px-5 py-4 flex items-center justify-between gap-3 select-none">
            <span className="font-serif text-lg text-brand-900 truncate">
              <span className="text-brand-400 mr-1">{idx+1}.</span>{cap.titulo || '(novo capítulo)'}
            </span>
            <span className="flex items-center gap-2 shrink-0 text-sm text-brand-400">
              <span>{vinculadas.length} ideia(s) · {palavras} palavras</span>
              <span>▾</span>
            </span>
          </summary>

          <div className="px-5 pb-5 space-y-3 border-t border-brand-100 pt-4">
            <input className={campoCls} value={cap.titulo} onChange={e=>onUpd({titulo:e.target.value})} placeholder="Título do capítulo / tema" />
            <input className={campoCls} value={cap.descricao||''} onChange={e=>onUpd({descricao:e.target.value})} placeholder="Descrição curta do tema (opcional)" />

            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-semibold uppercase tracking-wide text-brand-600">Ideias deste tema</span>
                <button onClick={onAbrirPicker} className="text-sm text-plum-600 hover:text-plum-700 font-medium">+ Vincular ideias</button>
              </div>
              {vinculadas.length===0
                ? <p className="text-sm text-brand-400">Nenhuma ideia vinculada ainda.</p>
                : <div className="flex flex-wrap gap-2">
                    {vinculadas.map(i => (
                      <span key={i.id} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs bg-plum-50 text-plum-700 ring-1 ring-plum-200">
                        {catById(i.categoria).emoji} {i.nome}
                        <button onClick={()=>onUpd({ideiaIds: cap.ideiaIds.filter(x=>x!==i.id)})} className="text-plum-400 hover:text-plum-700">✕</button>
                      </span>
                    ))}
                  </div>}
            </div>

            <div>
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-xs font-semibold uppercase tracking-wide text-brand-600">Texto do capítulo</span>
                {vinculadas.length>0 && <button onClick={montarRascunho} className="text-sm text-plum-600 hover:text-plum-700 font-medium">✨ Montar rascunho das ideias</button>}
              </div>
              <textarea rows="8" className={campoCls + ' font-sans leading-relaxed'} value={cap.texto||''} onChange={e=>onUpd({texto:e.target.value})} placeholder="Escreva aqui o conteúdo do capítulo..." />
            </div>

            <div className="flex flex-wrap gap-2 pt-1">
              <button onClick={()=>onMover(-1)} disabled={idx===0} className="px-3 py-1.5 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm disabled:opacity-40">↑ Subir</button>
              <button onClick={()=>onMover(1)} disabled={idx===total-1} className="px-3 py-1.5 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm disabled:opacity-40">↓ Descer</button>
              <button onClick={onRemover} className="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition text-sm ml-auto">Excluir capítulo</button>
            </div>
          </div>
        </details>
      );
    }

    /* ============================== ABA LIVRO ============================== */

    function LivroTab({ livros, setLivros, ideias, toast, abrir }) {
      const [selId, setSelId] = useState(livros[0]?.id || null);
      const [picker, setPicker] = useState(null); // capId
      const [verExport, setVerExport] = useState(false);
      const capaRef = useRef();
      useEffect(() => { if (abrir && abrir.n && abrir.id) setSelId(abrir.id); }, [abrir && abrir.n]);
      const livro = livros.find(l => l.id===selId) || null;

      const novoLivro = () => {
        const l = { id:uid(), titulo:'Meu novo livro', subtitulo:'', autor:'Jéssica Palin', sinopse:'', capitulos:[] };
        setLivros(s => [l, ...s]); setSelId(l.id);
      };
      const updLivro = (patch) => setLivros(s => s.map(l => l.id===selId ? {...l, ...patch} : l));
      const excluirLivro = (id) => { if(confirm('Excluir este livro?')){ setLivros(s=>s.filter(l=>l.id!==id)); if(selId===id) setSelId(null); } };

      const updCap = (capId, patch) => setLivros(s => s.map(l => l.id!==selId ? l : {...l, capitulos: l.capitulos.map(c => c.id===capId ? {...c, ...patch} : c)}));
      const addCap = () => updLivro({ capitulos: [...livro.capitulos, { id:uid(), titulo:'', descricao:'', ideiaIds:[], texto:'' }] });
      const removerCap = (capId) => { if(confirm('Excluir este capítulo?')) updLivro({ capitulos: livro.capitulos.filter(c=>c.id!==capId) }); };
      const moverCap = (capId, dir) => {
        const arr = [...livro.capitulos];
        const i = arr.findIndex(c=>c.id===capId);
        const j = i+dir;
        if (j<0 || j>=arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        updLivro({ capitulos: arr });
      };

      const gerarPor = (modo) => {
        let grupos;
        if (modo==='categoria') {
          grupos = CATEGORIAS.map(c => ({titulo:c.curto, itens: ideias.filter(i=>i.categoria===c.id)})).filter(g=>g.itens.length);
        } else {
          const projs = Array.from(new Set(ideias.map(i=>i.projeto).filter(Boolean))).sort();
          grupos = projs.map(p => ({titulo:p, itens: ideias.filter(i=>i.projeto===p)})).filter(g=>g.itens.length);
        }
        if (!grupos.length) { toast('Nenhuma ideia para agrupar'); return; }
        const existentes = new Set(livro.capitulos.map(c=>(c.titulo||'').toLowerCase()));
        const novos = grupos
          .filter(g => !existentes.has(g.titulo.toLowerCase()))
          .map(g => ({ id:uid(), titulo:g.titulo, descricao:'', ideiaIds:g.itens.map(i=>i.id), texto:'' }));
        if (!novos.length) { toast('Os capítulos já existem'); return; }
        updLivro({ capitulos: [...livro.capitulos, ...novos] });
        toast(`${novos.length} capítulo(s) criado(s) ✓`);
      };

      const baixarTxtLivro = () => {
        const blob = new Blob([textoLivro(livro, ideias)], {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = (livro.titulo||'livro').replace(/[\\/:|]/g,'-').trim() + '.txt';
        a.click(); URL.revokeObjectURL(url);
        toast('Livro .txt baixado ✓');
      };

      const campoCls = "w-full rounded-xl border border-brand-200 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300";

      // ----- Lista de livros -----
      if (!livro) {
        return (
          <div data-anim>
            <div className="flex items-center justify-between mb-6">
              <div>
                <h2 className="font-serif text-2xl text-brand-900">Produção de Livro</h2>
                <p className="text-sm text-brand-600">Organize as ideias da sua central em capítulos e publique.</p>
              </div>
              <button onClick={novoLivro} className="bg-plum-600 hover:bg-plum-700 text-white font-semibold px-4 py-2 rounded-xl transition shadow-sm">+ Novo livro</button>
            </div>
            {livros.length===0 ? (
              <div className="text-center py-20 text-brand-500">
                <p className="font-serif text-2xl mb-2">Nenhum livro ainda</p>
                <p className="text-sm">Clique em <strong>+ Novo livro</strong> para começar a montar seu primeiro livro.</p>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {livros.map(l => {
                  const ct = l.capitulos.filter(c=>contarPalavras(c.texto)>0).length;
                  const pc = l.capitulos.length ? Math.round(ct/l.capitulos.length*100) : 0;
                  return (
                  <div key={l.id} className="bg-white rounded-2xl border border-brand-200 p-5 shadow-sm hover:shadow-md transition">
                    <div className="text-3xl mb-2">📖</div>
                    <h3 className="font-serif text-lg text-brand-900">{l.titulo||'Sem título'}</h3>
                    {l.subtitulo && <p className="text-sm text-brand-600 mt-0.5">{l.subtitulo}</p>}
                    <p className="text-xs text-brand-400 mt-2">{l.capitulos.length} capítulo(s) · {pc}% escrito</p>
                    {l.capitulos.length>0 &&
                      <div className="h-1.5 rounded-full bg-brand-100 overflow-hidden mt-1.5">
                        <div className="h-full bg-plum-600 rounded-full" style={{width:pc+'%'}}></div>
                      </div>}
                    <div className="mt-4 flex gap-2">
                      <button onClick={()=>setSelId(l.id)} className="flex-1 bg-plum-600 hover:bg-plum-700 text-white font-medium py-2 rounded-lg transition text-sm">Abrir</button>
                      <button onClick={()=>excluirLivro(l.id)} className="px-3 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition text-sm">Excluir</button>
                    </div>
                  </div>
                  ); })}
              </div>
            )}
          </div>
        );
      }

      // ----- Editor do livro -----
      const totalIdeias = new Set(livro.capitulos.flatMap(c=>c.ideiaIds||[])).size;
      const totalPalavras = livro.capitulos.reduce((s,c)=>s+contarPalavras(c.texto),0);
      const capsComTexto = livro.capitulos.filter(c=>contarPalavras(c.texto)>0).length;
      const pctProgresso = livro.capitulos.length ? Math.round(capsComTexto/livro.capitulos.length*100) : 0;

      return (
        <div data-anim>
          <button onClick={()=>setSelId(null)} className="text-sm text-brand-500 hover:text-brand-800 mb-4">← Voltar aos livros</button>

          {/* CAPA / METADADOS */}
          <div className="bg-white rounded-2xl border border-brand-200 shadow-sm p-5 mb-5 space-y-3">
            <input className={campoCls + ' font-serif text-xl'} value={livro.titulo} onChange={e=>updLivro({titulo:e.target.value})} placeholder="Título do livro" />
            <div className="grid sm:grid-cols-2 gap-3">

    function EnviarLivroModal({ ideia, livros, setLivros, onFechar, toast }) {
      const [livroId, setLivroId] = useState(livros[0]?.id || '');
      const livro = livros.find(l => l.id===livroId) || null;
      const [capId, setCapId] = useState(livro?.capitulos[0]?.id || '__novo');
      const [novoTitulo, setNovoTitulo] = useState(ideia.nome);

      useEffect(() => {
        const l = livros.find(x => x.id===livroId);
        setCapId(l?.capitulos[0]?.id || '__novo');
      }, [livroId]);

      const criarLivro = () => {
        const l = { id:uid(), titulo:'Meu novo livro', subtitulo:'', autor:'Jéssica Palin', sinopse:'', capa:'', capitulos:[] };
        setLivros(s => [l, ...s]); setLivroId(l.id);
      };

      const confirmar = () => {
        setLivros(s => s.map(l => {
          if (l.id!==livroId) return l;
          let caps;
          if (capId==='__novo') {
            caps = [...l.capitulos, { id:uid(), titulo:(novoTitulo||ideia.nome), descricao:'', ideiaIds:[ideia.id], texto:'' }];
          } else {
            caps = l.capitulos.map(c => c.id===capId
              ? {...c, ideiaIds: (c.ideiaIds||[]).includes(ideia.id) ? c.ideiaIds : [...(c.ideiaIds||[]), ideia.id]}
              : c);
          }
          return {...l, capitulos: caps};
        }));
        toast('Ideia enviada ao livro ✓');
        onFechar();
      };

      const campoCls = "w-full rounded-xl border border-brand-200 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300";
      const label = "block text-xs font-semibold uppercase tracking-wide text-brand-600 mb-1.5";

      return (
        <div className="fixed inset-0 z-40 bg-brand-900/40 backdrop-blur-sm flex items-start justify-center p-4 overflow-auto" onClick={onFechar}>
          <div className="bg-brand-50 rounded-2xl shadow-2xl max-w-md w-full my-8 p-6" onClick={e=>e.stopPropagation()} data-anim>
            <h2 className="font-serif text-2xl text-brand-900 mb-1">Enviar para livro</h2>
            <p className="text-sm text-brand-600 mb-4">Ideia: <strong>{ideia.nome}</strong></p>

            {livros.length===0 ? (
              <div className="text-center py-6">
                <p className="text-sm text-brand-500 mb-4">Você ainda não tem nenhum livro.</p>
                <button onClick={criarLivro} className="bg-plum-600 hover:bg-plum-700 text-white font-semibold px-4 py-2 rounded-xl transition">+ Criar um livro agora</button>
              </div>
            ) : (
              <div className="space-y-4">
                <div>
                  <label className={label}>Livro</label>
                  <div className="flex gap-2">
                    <select value={livroId} onChange={e=>setLivroId(e.target.value)} className={campoCls}>
                      {livros.map(l => <option key={l.id} value={l.id}>{l.titulo||'(sem título)'}</option>)}
                    </select>
                    <button onClick={criarLivro} className="shrink-0 px-3 rounded-xl border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">+ Novo</button>
                  </div>
                </div>
                <div>
                  <label className={label}>Capítulo</label>
                  <select value={capId} onChange={e=>setCapId(e.target.value)} className={campoCls}>
                    {(livro?.capitulos||[]).map(c => <option key={c.id} value={c.id}>{c.titulo||'(sem título)'}</option>)}
                    <option value="__novo">➕ Criar novo capítulo</option>
                  </select>
                </div>
                {capId==='__novo' &&
                  <div>
                    <label className={label}>Título do novo capítulo</label>
                    <input className={campoCls} value={novoTitulo} onChange={e=>setNovoTitulo(e.target.value)} placeholder="Ex.: nome do tema" />
                  </div>}
                <div className="flex gap-3 pt-1">
                  <button onClick={confirmar} className="flex-1 bg-plum-600 hover:bg-plum-700 text-white font-semibold py-2.5 rounded-xl transition">Enviar</button>
                  <button onClick={onFechar} className="px-4 py-2.5 rounded-xl text-brand-500 hover:bg-brand-100 transition">Cancelar</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ReferenciaForm({ inicial, onSalvar, onCancelar, ideias }) {
      const [f, setF] = useState(inicial || {
        tipo:'Livro', titulo:'', autor:'', ano:'', fonte:'', link:'', trecho:'', notas:'',
        categoria:CATEGORIAS[0].id, tags:[], ideiaIds:[], anexo:null
      });
      const [tagsText, setTagsText] = useState((inicial?.tags||[]).join(', '));
      const fileRef = useRef();
      const set = (k,v) => setF(s => ({...s, [k]:v}));
      const toggle = (k,v) => setF(s => ({...s, [k]: s[k].includes(v) ? s[k].filter(x=>x!==v) : [...s[k], v]}));

      const escolherArquivo = async (file) => {
        if (!file) return;
        if (file.size > 80*1024*1024) { alert('Arquivo muito grande (máximo ~80 MB).'); return; }
        const id = uid();
        try { await idbSet(id, file); set('anexo', { id, nome:file.name, tipo:file.type, tamanho:file.size }); }
        catch { alert('Não foi possível anexar o arquivo.'); }
      };

      const submit = () => {
        if (!f.titulo.trim()) { alert('Dê um título à referência.'); return; }
        const tags = tagsText.split(',').map(t=>t.trim()).filter(Boolean);
        onSalvar({ ...f, tags });
      };

      const campoCls = "w-full rounded-xl border border-brand-200 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300";
      const label = "block text-xs font-semibold uppercase tracking-wide text-brand-600 mb-1.5";
      const pill = (on) => `text-xs px-2.5 py-1 rounded-full ring-1 transition ${on?'bg-plum-600 text-white ring-plum-600':'bg-white text-brand-600 ring-brand-200 hover:ring-plum-300'}`;

      return (
        <div className="space-y-4">
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className={label}>Tipo</label>
              <select className={campoCls} value={f.tipo} onChange={e=>set('tipo',e.target.value)}>
                {TIPOS_REF.map(t => <option key={t} value={t}>{iconeRef(t)} {t}</option>)}
              </select>
            </div>
            <div>
              <label className={label}>Categoria</label>
              <select className={campoCls} value={f.categoria} onChange={e=>set('categoria',e.target.value)}>
                {CATEGORIAS.map(c => <option key={c.id} value={c.id}>{c.emoji} {c.curto}</option>)}
              </select>
            </div>
          </div>

          <div>
            <label className={label}>Título *</label>
            <input className={campoCls} value={f.titulo} onChange={e=>set('titulo',e.target.value)} placeholder="Título do livro, artigo ou texto" />
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className={label}>Autor(es)</label>
              <input className={campoCls} value={f.autor} onChange={e=>set('autor',e.target.value)} placeholder="Ex.: Reuven Feuerstein" />
            </div>
            <div>
              <label className={label}>Ano</label>
              <input className={campoCls} value={f.ano} onChange={e=>set('ano',e.target.value)} placeholder="Ex.: 2014" />
            </div>
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className={label}>Fonte (editora / revista / site)</label>
              <input className={campoCls} value={f.fonte} onChange={e=>set('fonte',e.target.value)} placeholder="Ex.: Editora Vozes" />
            </div>
            <div>
              <label className={label}>Link / URL</label>
              <input className={campoCls} value={f.link} onChange={e=>set('link',e.target.value)} placeholder="https://..." />
            </div>
          </div>

          <div>
            <label className={label}>Trecho / citação importante</label>
            <textarea rows="3" className={campoCls} value={f.trecho} onChange={e=>set('trecho',e.target.value)} placeholder="Cole aqui um trecho ou citação que você quer guardar." />
          </div>

          <div>
            <label className={label}>Notas / por que é útil</label>
            <textarea rows="2" className={campoCls} value={f.notas} onChange={e=>set('notas',e.target.value)} placeholder="Suas anotações sobre esta referência." />
          </div>

          <div>
            <label className={label}>Etiquetas (separadas por vírgula)</label>
            <input className={campoCls} value={tagsText} onChange={e=>setTagsText(e.target.value)} placeholder="Ex.: mediação, aprendizagem, liderança" />
          </div>

          <div>
            <label className={label}>Arquivo anexado (PDF, DOCX, imagem...)</label>
            <input ref={fileRef} type="file" accept=".pdf,.doc,.docx,.txt,.rtf,.epub,image/*" className="hidden"
              onChange={e=>{ const file=e.target.files[0]; escolherArquivo(file); e.target.value=''; }} />
            {f.anexo ? (
              <div className="flex items-center gap-2 rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm">
                <span className="truncate">📎 {f.anexo.nome} <span className="text-brand-400">({formatarTamanho(f.anexo.tamanho)})</span></span>
                <div className="ml-auto flex gap-3 shrink-0">
                  <button type="button" onClick={()=>abrirAnexo(f.anexo, ()=>alert('Arquivo não encontrado.'))} className="text-plum-600 hover:text-plum-700 font-medium">Abrir</button>
                  <button type="button" onClick={()=>fileRef.current.click()} className="text-brand-600 hover:text-brand-800 font-medium">Trocar</button>
                  <button type="button" onClick={()=>set('anexo', null)} className="text-red-500 hover:text-red-700 font-medium">Remover</button>

          <div>

                    <button type="button" key={i.id} onClick={()=>toggle('ideiaIds', i.id)} className={pill(f.ideiaIds.includes(i.id))}>
                      {catById(i.categoria).emoji} {i.nome}

                  ))}
                </div>}
          </div>

          <div className="flex gap-3 pt-1">
            <button onClick={submit} className="flex-1 bg-plum-600 hover:bg-plum-700 text-white font-semibold py-2.5 rounded-xl transition">Salvar referência</button>
            <button onClick={onCancelar} className="px-5 py-2.5 rounded-xl text-brand-500 hover:bg-brand-100 transition">Cancelar</button>
          </div>
        </div>
      );
    }

            <button onClick={()=>onEditar(r)} className="px-3 py-2 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition">Editar</button>
