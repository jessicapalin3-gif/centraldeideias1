    function VisualizadorAnexo({ anexo, onFechar }) {
      const [url, setUrl] = useState(null);
      const [erro, setErro] = useState(false);
      useEffect(() => {
        let u;
        idbGet(anexo.id).then(blob => {
          if (!blob) { setErro(true); return; }
          u = URL.createObjectURL(blob); setUrl(u);
        }).catch(() => setErro(true));
        return () => { if (u) URL.revokeObjectURL(u); };
      }, [anexo.id]);

      const ehImg = (anexo.tipo||'').startsWith('image/');
      const ehPdf = (anexo.tipo||'').includes('pdf') || /\.pdf$/i.test(anexo.nome||'');
      const baixar = () => { if (!url) return; const a=document.createElement('a'); a.href=url; a.download=anexo.nome; document.body.appendChild(a); a.click(); a.remove(); };

      return (
        <div className="fixed inset-0 z-50 bg-brand-900/60 backdrop-blur-sm flex flex-col p-4" onClick={onFechar}>
          <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full mx-auto my-2 flex flex-col flex-1 overflow-hidden" onClick={e=>e.stopPropagation()} data-anim>
            <div className="flex items-center justify-between gap-3 px-5 py-3 border-b border-brand-200">
              <span className="font-serif text-lg text-brand-900 truncate">📎 {anexo.nome} <span className="text-sm text-brand-400">({formatarTamanho(anexo.tamanho)})</span></span>
              <div className="flex gap-2 shrink-0">
                <button onClick={baixar} className="px-3 py-1.5 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">Baixar</button>
                {url && <a href={url} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">Nova aba</a>}
                <button onClick={onFechar} className="px-3 py-1.5 rounded-lg bg-brand-900 text-white hover:bg-brand-800 transition text-sm">Fechar</button>
              </div>
            </div>
            <div className="flex-1 bg-brand-100 overflow-auto flex items-center justify-center">
              {erro ? <p className="text-sm text-brand-500 p-8">Arquivo não encontrado neste navegador.</p>
               : !url ? <p className="text-sm text-brand-500 p-8">Carregando…</p>
               : ehImg ? <img src={url} alt={anexo.nome} className="max-w-full max-h-full object-contain" />
               : ehPdf ? <iframe src={url} title={anexo.nome} className="w-full h-full" style={{border:'none'}} />
               : <div className="text-center p-8 text-brand-600">
                   <p className="mb-3">Este tipo de arquivo não pode ser pré-visualizado aqui (ex.: DOCX).</p>
                   <button onClick={baixar} className="bg-plum-600 hover:bg-plum-700 text-white font-medium px-4 py-2 rounded-xl transition">Baixar arquivo</button>
                 </div>}
            </div>
          </div>
        </div>
      );
    }

    function ReferenciasTab({ refs, setRefs, ideias, copiar, toast, filtroIdeia, setFiltroIdeia, seed }) {
      const [modal, setModal] = useState(null); // null | 'nova' | referencia
      const [busca, setBusca] = useState('');
      useEffect(() => { if (seed && seed.n) setBusca(seed.q); }, [seed && seed.n]);
      const [filtroTipo, setFiltroTipo] = useState('todos');
      const [filtroCat, setFiltroCat] = useState('todas');
      const [preview, setPreview] = useState(null); // anexo em pré-visualização

      const salvarRef = (dados) => {
        if (dados.id) setRefs(s => s.map(r => r.id===dados.id ? dados : r));
        else setRefs(s => [{...dados, id:uid(), criadoEm:Date.now()}, ...s]);
        setModal(null);
        toast('Referência salva ✓');
      };
      const excluir = (r) => { if (confirm('Excluir esta referência?')) { if (r.anexo) idbDel(r.anexo.id); setRefs(s => s.filter(x=>x.id!==r.id)); } };

      const ideiaFiltro = filtroIdeia ? ideias.find(i=>i.id===filtroIdeia) : null;

      const filtradas = useMemo(() => refs
        .filter(r => !filtroIdeia || (r.ideiaIds||[]).includes(filtroIdeia))
        .filter(r => filtroTipo==='todos' || r.tipo===filtroTipo)
        .filter(r => filtroCat==='todas' || r.categoria===filtroCat)
        .filter(r => {
          const q = busca.trim().toLowerCase();
          if (!q) return true;
          return [r.titulo,r.autor,r.fonte,r.trecho,r.notas,(r.tags||[]).join(' ')].join(' ').toLowerCase().includes(q);
        }), [refs, filtroTipo, filtroCat, busca, filtroIdeia]);

      return (
        <div data-anim>
          <div className="flex items-center justify-between mb-5 gap-3">
            <div>
              <h2 className="font-serif text-2xl text-brand-900">Referências</h2>
              <p className="text-sm text-brand-600">Livros, artigos, textos e links que alimentam suas ideias.</p>
            </div>
            <button onClick={()=>setModal('nova')} className="shrink-0 bg-plum-600 hover:bg-plum-700 text-white font-semibold px-4 py-2 rounded-xl transition shadow-sm">+ Nova referência</button>
          </div>

          {ideiaFiltro &&
            <div className="mb-4 inline-flex items-center gap-2 text-sm bg-plum-50 border border-plum-200 text-plum-800 rounded-xl px-3 py-2">
              📚 Referências da ideia: <strong>{ideiaFiltro.nome}</strong>
              <button onClick={()=>setFiltroIdeia(null)} className="ml-1 text-plum-500 hover:text-plum-700">✕ limpar</button>
            </div>}

          <div className="flex flex-wrap gap-3 mb-6 items-center">
            <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar por título, autor, trecho..."
              className="flex-1 min-w-[200px] rounded-xl border border-brand-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300" />
            <select value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)} className="rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
              <option value="todos">Todos os tipos</option>
              {TIPOS_REF.map(t => <option key={t} value={t}>{iconeRef(t)} {t}</option>)}
            </select>
            <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} className="rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
              <option value="todas">Todas as categorias</option>
              {CATEGORIAS.map(c => <option key={c.id} value={c.id}>{c.emoji} {c.curto}</option>)}
            </select>
          </div>

          {filtradas.length===0 ? (
            <div className="text-center py-20 text-brand-500">
              <p className="font-serif text-2xl mb-2">Nenhuma referência aqui</p>
              <p className="text-sm">Clique em <strong>+ Nova referência</strong> para guardar um livro, artigo ou texto.</p>
            </div>
          ) : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {filtradas.map(r => (
                <ReferenciaCard key={r.id} referencia={r} ideias={ideias} copiar={copiar} toast={toast}
                  onEditar={setModal} onExcluir={excluir} onPreview={setPreview} />
              ))}
            </div>
          )}

          {modal && (
            <div className="fixed inset-0 z-40 bg-brand-900/40 backdrop-blur-sm flex items-start justify-center p-4 overflow-auto" onClick={()=>setModal(null)}>
              <div className="bg-brand-50 rounded-2xl shadow-2xl max-w-2xl w-full my-8 p-6" onClick={e=>e.stopPropagation()} data-anim>
                <h2 className="font-serif text-2xl text-brand-900 mb-5">{modal==='nova'?'Nova referência':'Editar referência'}</h2>
                <ReferenciaForm inicial={modal==='nova'?null:modal} onSalvar={salvarRef} onCancelar={()=>setModal(null)} ideias={ideias} />
              </div>
            </div>
          )}

          {preview && <VisualizadorAnexo anexo={preview} onFechar={()=>setPreview(null)} />}
        </div>
      );
    }

    /* ============================== BUSCA GLOBAL ============================== */

    function Realce({ texto, termo }) {
      const t = texto || '';
      const q = (termo||'').trim();
      if (!q) return t;
      const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const partes = t.split(new RegExp(`(${esc})`, 'ig'));
      return partes.map((p,i) => p.toLowerCase()===q.toLowerCase()
        ? <mark key={i} className="rounded px-0.5 font-semibold" style={{background:'rgba(154,168,86,.45)', color:'inherit'}}>{p}</mark>
        : p);
    }

    function BuscaGlobal({ ideias, refs, livros, onFechar, onIrIdeia, onIrRef, onIrLivro }) {
      const [q, setQ] = useState('');
      const termo = q.trim().toLowerCase();

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onFechar(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const res = useMemo(() => {
        if (!termo) return { ideias:[], refs:[], livros:[] };
        const m = (...campos) => campos.filter(Boolean).join(' ').toLowerCase().includes(termo);
        const ri = ideias.filter(i => m(i.nome,i.problema,i.publico,i.proximo,i.projeto,i.notas,(i.formatos||[]).join(' '),(i.conexoes||[]).join(' '))).slice(0,8);
        const rr = refs.filter(r => m(r.titulo,r.autor,r.fonte,r.trecho,r.notas,(r.tags||[]).join(' '))).slice(0,8);
        const rl = [];
        livros.forEach(l => {
          if (m(l.titulo,l.subtitulo,l.autor,l.sinopse)) rl.push({ livro:l, cap:null });
          (l.capitulos||[]).forEach(c => { if (m(c.titulo,c.descricao,c.texto)) rl.push({ livro:l, cap:c }); });
        });
        return { ideias:ri, refs:rr, livros:rl.slice(0,8) };
      }, [termo, ideias, refs, livros]);

      const total = res.ideias.length + res.refs.length + res.livros.length;
      const grupoCls = "text-xs font-semibold uppercase tracking-wide text-brand-500 px-3 pt-3 pb-1";
      const itemCls = "w-full text-left px-3 py-2.5 rounded-xl hover:bg-plum-50 transition flex items-start gap-2.5";

      return (
        <div className="fixed inset-0 z-50 bg-brand-900/50 backdrop-blur-sm flex items-start justify-center p-4" onClick={onFechar}>
          <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full mt-[8vh] overflow-hidden" onClick={e=>e.stopPropagation()} data-anim>
            <div className="flex items-center gap-2 px-4 py-3 border-b border-brand-200">
              <span className="text-brand-400">🔍</span>
              <input autoFocus value={q} onChange={e=>setQ(e.target.value)}
                placeholder="Buscar em ideias, referências e livros..."
                className="flex-1 bg-transparent text-sm focus:outline-none text-brand-900" />
              <kbd className="text-[10px] text-brand-400 border border-brand-200 rounded px-1.5 py-0.5">Esc</kbd>
            </div>

            <div className="max-h-[60vh] overflow-auto pb-2">
              {!termo ? (
                <p className="text-sm text-brand-400 p-6 text-center">Digite para buscar em todo o seu acervo.</p>
              ) : total===0 ? (
                <p className="text-sm text-brand-400 p-6 text-center">Nada encontrado para “{q}”.</p>
              ) : (
                <>
                  {res.ideias.length>0 && <div>
                    <div className={grupoCls}>💡 Ideias</div>
                    {res.ideias.map(i => (
                      <button key={i.id} className={itemCls} onClick={()=>onIrIdeia(i)}>
                        <span>{catById(i.categoria).emoji}</span>
                        <span className="min-w-0">
                          <span className="block text-sm text-brand-900 truncate"><Realce texto={i.nome} termo={q} /></span>
                          <span className="block text-xs text-brand-400 truncate">{catById(i.categoria).curto}{i.projeto?` · ${i.projeto}`:''}</span>
                        </span>
                      </button>
                    ))}
                  </div>}

                  {res.refs.length>0 && <div>
                    <div className={grupoCls}>📚 Referências</div>
                    {res.refs.map(r => (
                      <button key={r.id} className={itemCls} onClick={()=>onIrRef(r)}>
                        <span>{iconeRef(r.tipo)}</span>
                        <span className="min-w-0">
                          <span className="block text-sm text-brand-900 truncate"><Realce texto={r.titulo} termo={q} /></span>
                          <span className="block text-xs text-brand-400 truncate"><Realce texto={[r.autor,r.ano].filter(Boolean).join(' · ')||r.tipo} termo={q} /></span>
                        </span>
                      </button>
                    ))}
                  </div>}

                  {res.livros.length>0 && <div>
                    <div className={grupoCls}>📖 Livros</div>
                    {res.livros.map((x,idx) => (
                      <button key={x.livro.id+'-'+(x.cap?x.cap.id:'capa')+idx} className={itemCls} onClick={()=>onIrLivro(x.livro.id)}>
                        <span>{x.cap?'📄':'📘'}</span>
                        <span className="min-w-0">
                          <span className="block text-sm text-brand-900 truncate"><Realce texto={x.cap ? x.cap.titulo || '(capítulo sem título)' : x.livro.titulo || '(livro sem título)'} termo={q} /></span>
                          <span className="block text-xs text-brand-400 truncate">{x.cap ? `Capítulo de “${x.livro.titulo||'livro'}”` : 'Livro'}</span>
                        </span>
                      </button>
                    ))}
                  </div>}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ============================== CHAT MENTOR ============================== */

    const SUGESTAO_PASSO = {
      inicial:'Definir o tema central e o público em 1 frase',
      pesquisa:'Levantar 3 referências e o conceito principal',
      estruturada:'Escrever a primeira versão (esboço)',
      pronta:'Agendar a publicação ou apresentação',
      publicada:'',
    };

    function LinhaDefinirPasso({ ideia, onSalvar }) {
      const [passo, setPasso] = useState(ideia.proximo || SUGESTAO_PASSO[ideia.nivel] || '');
      const [prazo, setPrazo] = useState(ideia.prazo || emDias(7));
      const campoCls = "rounded-xl border border-brand-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300";
      return (
        <div className="rounded-xl border border-brand-100 p-3">
          <div className="text-sm font-medium text-brand-800 mb-2">{catById(ideia.categoria).emoji} {ideia.nome} <span className="text-xs text-brand-400">· {nivelById(ideia.nivel).nome}</span></div>
          <div className="flex flex-col sm:flex-row gap-2">
            <input className={campoCls + ' flex-1'} value={passo} onChange={e=>setPasso(e.target.value)} placeholder="Próximo passo" />
            <input type="date" className={campoCls} value={prazo} onChange={e=>setPrazo(e.target.value)} />
            <button onClick={()=>{ if(!passo.trim()) return; onSalvar(ideia.id, passo.trim(), prazo); }} className="bg-plum-600 hover:bg-plum-700 text-white font-medium px-4 py-2 rounded-xl transition text-sm shrink-0">Definir</button>
          </div>
          {(!ideia.proximo || !ideia.prazo) && <p className="text-xs text-brand-400 mt-1">💡 Sugestão preenchida automaticamente — ajuste se quiser.</p>}
        </div>
      );
    }

    function ChatMentor({ ideias, setIdeias, toast }) {
      const [mensagens, setMensagens] = useState(() => { try { return JSON.parse(localStorage.getItem('central_ideias_chat_v1')) || []; } catch { return []; } });
      const [entrada, setEntrada] = useState('');
      const [carregando, setCarregando] = useState(false);
      const [verCfg, setVerCfg] = useState(false);
      const [salvarNota, setSalvarNota] = useState(null); // {texto} | null
      const [notaIdeiaId, setNotaIdeiaId] = useState(ideias[0]?.id || '');
      const [cfg, setCfg] = useState(() => { try { return Object.assign({usarIA:false, key:'', model:'claude-3-5-sonnet-20241022'}, JSON.parse(localStorage.getItem('central_ideias_chat_cfg_v1'))||{}); } catch { return {usarIA:false, key:'', model:'claude-3-5-sonnet-20241022'}; } });
      const fimRef = useRef();

      useEffect(() => { try { localStorage.setItem('central_ideias_chat_v1', JSON.stringify(mensagens)); } catch {} }, [mensagens]);
      useEffect(() => { try { localStorage.setItem('central_ideias_chat_cfg_v1', JSON.stringify(cfg)); } catch {} }, [cfg]);
      useEffect(() => { if (fimRef.current) fimRef.current.scrollIntoView({behavior:'smooth'}); }, [mensagens, carregando]);

      const ctx = () => ({
        atrasados: ideias.filter(i=>i.prazo && i.nivel!=='publicada' && diffDias(i.prazo)<0).sort((a,b)=>a.prazo.localeCompare(b.prazo)),
        totalIdeias: ideias.length,
        paradas: ideias.filter(i=>i.nivel==='inicial').length,
      });

      const construirSistema = (c) => {
        let dados = `Ela tem ${c.totalIdeias} ideia(s) no sistema, ${c.paradas} ainda em estágio inicial.`;
        if (c.atrasados.length) dados += ` Próximos passos ATRASADOS (${c.atrasados.length}): ` + c.atrasados.slice(0,6).map(i=>`"${i.proximo||i.nome}" (${-diffDias(i.prazo)} dias, ideia: ${i.nome})`).join('; ') + '.';
        else dados += ' Nenhum próximo passo atrasado no momento.';
        return PERSONA_SISTEMA + '\n\nContexto atual (dados reais do app dela):\n' + dados;
      };

      const chamarIA = async (historico) => {
        const msgs = historico.filter(m=>m.role==='user'||m.role==='assistant');
        while (msgs.length && msgs[0].role!=='user') msgs.shift();
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method:'POST',
          headers:{ 'content-type':'application/json', 'x-api-key':cfg.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
          body: JSON.stringify({ model: cfg.model||'claude-3-5-sonnet-20241022', max_tokens:600, system: construirSistema(ctx()), messages: msgs.map(m=>({role:m.role, content:m.texto})) })
        });
        if (!resp.ok) throw new Error((await resp.text()).slice(0,160));
        const data = await resp.json();
        return (data.content||[]).map(c=>c.text).join('').trim() || '(sem resposta)';
      };

      const enviar = async (txt) => {
        const t = (txt!==undefined ? txt : entrada).trim();
        if (!t || carregando) return;
        const novo = [...mensagens, {role:'user', texto:t}];
        setMensagens(novo); setEntrada('');
        if (cfg.usarIA && cfg.key) {
          setCarregando(true);
          try { const r = await chamarIA(novo); setMensagens(m=>[...m, {role:'assistant', texto:r}]); }
          catch(e) { setMensagens(m=>[...m, {role:'assistant', texto:'⚠️ Não consegui falar com a IA ('+e.message+').\n\nSeguindo no modo local:\n\n'+mentorLocal(t, ctx(), novo.length)}]); }
          finally { setCarregando(false); }
        } else {
          setMensagens(m=>[...m, {role:'assistant', texto: mentorLocal(t, ctx(), novo.length)}]);
        }
      };

      const limpar = () => { if (confirm('Apagar toda a conversa?')) setMensagens([]); };
      const chips = ['Estou enrolando em algo','Preciso decidir uma coisa','Uma pessoa me decepcionou','Me faça uma pergunta difícil','Reality check dos meus prazos'];

      const semPasso = ideias.filter(i => i.nivel!=='publicada' && (!(i.proximo||'').trim() || !i.prazo));
      const definirPasso = (id, passo, prazo) => { setIdeias(s => s.map(i => i.id===id ? {...i, proximo:passo, prazo} : i)); toast('Próximo passo definido ✓'); };

      const confirmarNota = () => {
        if (!notaIdeiaId) { toast('Escolha uma ideia'); return; }
        const nova = { data: hojeISO(), texto: salvarNota.texto };
        setIdeias(s => s.map(i => i.id===notaIdeiaId ? {...i, reflexoes: [...(i.reflexoes||[]), nova]} : i));
        toast('Reflexão salva na ideia ✓');
        setSalvarNota(null);
      };
      const modoIA = cfg.usarIA && cfg.key;
      const campoCls = "w-full rounded-xl border border-brand-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300";

      return (
        <div data-anim className="max-w-3xl mx-auto">
          <div className="flex items-start justify-between gap-3 mb-2">
            <div>
              <h2 className="font-serif text-2xl text-brand-900">🧭 Mentor</h2>
              <p className="text-sm text-brand-600">Um chat pra te questionar, não pra te dar razão.</p>
            </div>
            <div className="flex gap-2 shrink-0">
              <button onClick={()=>setVerCfg(v=>!v)} className="px-3 py-2 rounded-xl border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">⚙️ IA</button>
              {mensagens.length>0 && <button onClick={limpar} className="px-3 py-2 rounded-xl border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">🗑️</button>}
            </div>
          </div>

          <p className="text-xs text-brand-400 mb-3">Modo atual: <strong className={modoIA?'text-plum-600':'text-brand-600'}>{modoIA?'IA conectada':'Coach local (offline)'}</strong></p>

          {verCfg &&
            <div className="bg-white border border-brand-200 rounded-2xl p-4 mb-3 space-y-3 text-sm" data-anim>
              <label className="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked={cfg.usarIA} onChange={e=>setCfg(c=>({...c, usarIA:e.target.checked}))} />
                <span>Usar IA (Anthropic) quando houver chave</span>
              </label>
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wide text-brand-600 mb-1.5">Chave de API</label>
                <input type="password" className={campoCls} value={cfg.key} onChange={e=>setCfg(c=>({...c, key:e.target.value}))} placeholder="sk-ant-..." />
              </div>
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wide text-brand-600 mb-1.5">Modelo</label>
                <input className={campoCls} value={cfg.model} onChange={e=>setCfg(c=>({...c, model:e.target.value}))} placeholder="claude-3-5-sonnet-20241022" />
              </div>
              <p className="text-xs text-brand-400">Sem chave, o Mentor funciona no modo coach local (offline e grátis). Com chave, as respostas ficam mais inteligentes (a Anthropic cobra por uso). Sua chave e suas conversas ficam só neste computador. A chave é criada em console.anthropic.com.</p>
            </div>}

          {semPasso.length>0 &&
            <details className="bg-white border border-brand-200 rounded-2xl shadow-sm mb-3">
              <summary className="cursor-pointer list-none px-4 py-3 flex items-center justify-between select-none">
                <span className="font-serif text-base text-brand-900">🎯 Ideias sem próximo passo definido</span>
                <span className="text-sm text-brand-400">{semPasso.length} ▾</span>
              </summary>
              <div className="px-4 pb-4 space-y-3">
                <p className="text-xs text-brand-500">Toda ideia precisa de uma próxima ação com prazo, senão vira intenção. Eu já sugeri uma — confirme ou ajuste:</p>
                {semPasso.map(i => <LinhaDefinirPasso key={i.id} ideia={i} onSalvar={definirPasso} />)}
              </div>
            </details>}

          <div className="bg-white border border-brand-200 rounded-2xl shadow-sm flex flex-col" style={{height:'62vh'}}>
            <div className="flex-1 overflow-auto p-4 space-y-3">
              {mensagens.length===0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center">
                  <div className="text-4xl mb-2">🧭</div>
                  <p className="font-serif text-xl text-brand-800 mb-1">Seu Mentor</p>
                  <p className="text-sm text-brand-500 max-w-md">Não tô aqui pra concordar com você, Jéssica — tô aqui pra te fazer pensar e agir. Por onde começamos?</p>
                  <div className="flex flex-wrap gap-2 justify-center mt-4">
                    {chips.map(c => <button key={c} onClick={()=>enviar(c)} className="text-sm px-3 py-1.5 rounded-full border border-brand-200 text-brand-700 hover:bg-plum-50 hover:border-plum-300 transition">{c}</button>)}
                  </div>
                </div>
              ) : (
                <>
                  {mensagens.map((m,i) => (
                    <div key={i} className={`flex flex-col ${m.role==='user'?'items-end':'items-start'}`}>
                      <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap leading-relaxed ${m.role==='user'?'bg-plum-600 text-white':'bg-brand-100 text-brand-800'}`}>{m.texto}</div>
                      <button onClick={()=>{ setNotaIdeiaId(ideias[0]?.id||''); setSalvarNota({texto:m.texto}); }} title="Salvar como nota numa ideia" className="mt-1 text-[11px] text-brand-400 hover:text-plum-600 transition">📌 salvar como nota</button>
                    </div>
                  ))}
                  {carregando && <div className="flex justify-start"><div className="bg-brand-100 text-brand-500 rounded-2xl px-4 py-2.5 text-sm">pensando…</div></div>}
                </>
              )}
              <div ref={fimRef} />
            </div>

            <div className="border-t border-brand-200 p-3 flex gap-2 items-end">
              <textarea rows="1" value={entrada} onChange={e=>setEntrada(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } }}
                placeholder="Escreva aqui… (Enter envia, Shift+Enter quebra linha)"
                className="flex-1 resize-none rounded-xl border border-brand-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300" style={{maxHeight:'120px'}} />
              <button onClick={()=>enviar()} disabled={carregando} className="bg-plum-600 hover:bg-plum-700 disabled:opacity-50 text-white font-semibold px-4 py-2 rounded-xl transition shrink-0">Enviar</button>
            </div>
          </div>

          {salvarNota &&
            <div className="fixed inset-0 z-50 bg-brand-900/50 backdrop-blur-sm flex items-start justify-center p-4 overflow-auto" onClick={()=>setSalvarNota(null)}>
              <div className="bg-brand-50 rounded-2xl shadow-2xl max-w-md w-full mt-[10vh] p-6" onClick={e=>e.stopPropagation()} data-anim>
                <h2 className="font-serif text-2xl text-brand-900 mb-3">Salvar reflexão na ideia</h2>
                <p className="text-sm text-brand-600 italic border-l-2 border-plum-200 pl-3 mb-4 max-h-32 overflow-auto">{salvarNota.texto}</p>
                {ideias.length===0 ? (
                  <p className="text-sm text-brand-500">Você ainda não tem ideias na central.</p>
                ) : (
                  <>
                    <label className="block text-xs font-semibold uppercase tracking-wide text-brand-600 mb-1.5">Anexar à ideia</label>
                    <select value={notaIdeiaId} onChange={e=>setNotaIdeiaId(e.target.value)} className="w-full rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
                      {ideias.map(i => <option key={i.id} value={i.id}>{catById(i.categoria).emoji} {i.nome}</option>)}
                    </select>
                    <div className="flex gap-3 mt-4">
                      <button onClick={confirmarNota} className="flex-1 bg-plum-600 hover:bg-plum-700 text-white font-semibold py-2.5 rounded-xl transition">Salvar nota</button>
                      <button onClick={()=>setSalvarNota(null)} className="px-4 py-2.5 rounded-xl text-brand-500 hover:bg-brand-100 transition">Cancelar</button>
                    </div>
                  </>
                )}
              </div>
            </div>}
        </div>
      );
    }

    /* ============================== APP ============================== */

    function App() {
      const [ideias, setIdeias] = useState(carregar);
      const [livros, setLivros] = useState(carregarLivros);
      const [refs, setRefs] = useState(carregarRefs);
      const [aba, setAba] = useState('ideias'); // ideias | prompts | livro | refs
      const [modal, setModal] = useState(null); // null | 'nova' | ideia(edição)
      const [filtroCat, setFiltroCat] = useState('todas');
      const [filtroNivel, setFiltroNivel] = useState('todos');
      const [filtroProjeto, setFiltroProjeto] = useState('todos');
      const [busca, setBusca] = useState('');
      const [vista, setVista] = useState('cards'); // cards | kanban
      const [agrupar, setAgrupar] = useState('nenhum'); // nenhum | projeto | categoria
      const [exportarIdeia, setExportarIdeia] = useState(null); // null | ideia
      const [enviarLivro, setEnviarLivro] = useState(null); // null | ideia
      const [refFiltroIdeia, setRefFiltroIdeia] = useState(null); // id da ideia p/ filtrar referências
      const [buscaAberta, setBuscaAberta] = useState(false);
      const [tema, setTema] = useState(() => localStorage.getItem('central_ideias_tema') || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'));
      const [refSeed, setRefSeed] = useState({ q:'', n:0 });
      const [livroSeed, setLivroSeed] = useState({ id:null, n:0 });
      const [ideiaParaPrompt, setIdeiaParaPrompt] = useState(null);
      const [toastNode, toast] = useToast();
      const fileRef = useRef();

      useEffect(()=>{ salvar(ideias); }, [ideias]);
      useEffect(()=>{ salvarLivros(livros); }, [livros]);
      useEffect(()=>{ salvarRefs(refs); }, [refs]);
      useEffect(()=>{ document.documentElement.classList.toggle('dark', tema==='dark'); localStorage.setItem('central_ideias_tema', tema); }, [tema]);

      const projetos = useMemo(() =>
        Array.from(new Set(ideias.map(i=>i.projeto).filter(Boolean))).sort(), [ideias]);

      const filtradas = useMemo(() => {
        return ideias
          .filter(i => filtroCat==='todas' || i.categoria===filtroCat)
          .filter(i => filtroNivel==='todos' || i.nivel===filtroNivel)
          .filter(i => filtroProjeto==='todos' || (i.projeto||'')===filtroProjeto)
          .filter(i => {
            if (!busca.trim()) return true;
            const q = busca.toLowerCase();
            return [i.nome,i.problema,i.publico,i.proximo,i.notas,...(i.formatos||[]),...(i.conexoes||[])]
              .join(' ').toLowerCase().includes(q);
          })
          .sort((a,b)=> (b.data||'').localeCompare(a.data||'') || (b.criadoEm||0)-(a.criadoEm||0));
      }, [ideias, filtroCat, filtroNivel, filtroProjeto, busca]);

      const grupos = useMemo(() => {
        if (agrupar==='nenhum') return [{chave:'__all', titulo:null, itens:filtradas}];
        if (agrupar==='categoria') {
          return CATEGORIAS
            .map(c => ({chave:c.id, titulo:`${c.emoji} ${c.curto}`, itens:filtradas.filter(i=>i.categoria===c.id)}))
            .filter(g=>g.itens.length);
        }
        const comProjeto = projetos
          .map(p => ({chave:p, titulo:`📁 ${p}`, itens:filtradas.filter(i=>i.projeto===p)}))
          .filter(g=>g.itens.length);
        const semProjeto = filtradas.filter(i=>!i.projeto);
        return semProjeto.length ? [...comProjeto, {chave:'__sem', titulo:'📂 Sem projeto', itens:semProjeto}] : comProjeto;
      }, [agrupar, filtradas, projetos]);

      const moverNivel = (id, nivel) => setIdeias(s => s.map(i => i.id===id ? {...i, nivel} : i));

      const lembretes = useMemo(() =>
        ideias.filter(i => i.prazo && i.nivel!=='publicada')
              .sort((a,b)=> a.prazo.localeCompare(b.prazo)), [ideias]);
      const atrasados = lembretes.filter(i => diffDias(i.prazo) < 0).length;

      const baixarICS = (ideia) => {
        const blob = new Blob([icsDeIdeia(ideia)], {type:'text/calendar;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `lembrete-${(ideia.nome||'ideia').replace(/[\\/:|]/g,'-').slice(0,40).trim()}.ics`;
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        toast('Evento de calendário baixado ✓');
      };

      const emailLembretes = () => {
        if (lembretes.length===0) { toast('Nenhum próximo passo com prazo'); return; }
        const linhas = lembretes.map(i => `• [${rotuloPrazo(i.prazo).txt}] ${formatarData(i.prazo)} — ${i.proximo||i.nome} (${i.nome})`);
        const corpo = encodeURIComponent('Meus próximos passos (Central de Ideias):\n\n' + linhas.join('\n'));
        const assunto = encodeURIComponent('Central de Ideias — Meus próximos passos');
        window.location.href = `mailto:?subject=${assunto}&body=${corpo}`;
      };

      const notificarPendentes = (manual) => {
        if (!('Notification' in window) || Notification.permission!=='granted') { if (manual) toast('Ative os lembretes primeiro'); return; }
        const urgentes = lembretes.filter(i => diffDias(i.prazo) <= 0);
        if (urgentes.length===0) { if (manual) toast('Nada atrasado ou para hoje 👍'); return; }
        const corpo = urgentes.slice(0,5).map(i => `• ${i.proximo||i.nome}`).join('\n');
        try { new Notification(`🔔 ${urgentes.length} passo(s) para hoje/atrasado`, { body: corpo }); } catch {}
      };

      const ativarLembretes = async () => {
        if (!('Notification' in window)) { toast('Notificações não suportadas neste navegador'); return; }
        const p = await Notification.requestPermission();
        if (p==='granted') { toast('Lembretes ativados ✓'); notificarPendentes(true); }
        else toast('Permissão de notificação negada');
      };

      useEffect(() => { notificarPendentes(false); }, []);

      const statsCat = useMemo(() =>
        CATEGORIAS.map(c => ({...c, n: ideias.filter(i=>i.categoria===c.id).length})), [ideias]);
      const statsNivel = useMemo(() =>
        NIVEIS.map(n => ({...n, n: ideias.filter(i=>i.nivel===n.id).length})), [ideias]);
      const maxCat = Math.max(1, ...statsCat.map(s=>s.n));

      const baixarTxt = (i) => {
        const blob = new Blob([textoExport(i)], {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = nomePadronizado(i).replace(/[\\/:|]/g,'-').trim() + '.txt';
        a.click(); URL.revokeObjectURL(url);
        toast('Arquivo .txt baixado ✓');
      };

      const salvarIdeia = (dados) => {
        if (dados.id) {
          setIdeias(s => s.map(i => i.id===dados.id ? {...i,...dados} : i));
          toast('Ideia atualizada ✓');
        } else {
          setIdeias(s => [{...dados, id:uid(), criadoEm:Date.now()}, ...s]);
          toast('Ideia salva ✓');
        }
        setModal(null);
      };

      const excluir = (ideia) => {
        if (confirm(`Excluir a ideia "${ideia.nome}"?`)) {
          setIdeias(s => s.filter(i => i.id!==ideia.id));
          toast('Ideia excluída');
        }
      };

      const copiarFicha = (i) => {
        const txt =
`FICHA DA IDEIA
Nome: ${i.nome}
Nome padronizado: ${nomePadronizado(i)}
Categoria: ${catById(i.categoria).nome}
Projeto: ${i.projeto||'—'}
Público-alvo: ${i.publico||'—'}
Problema que resolve: ${i.problema||'—'}
Formato possível: ${(i.formatos||[]).join(', ')||'—'}
Nível de maturidade: ${nivelById(i.nivel).nome}
Conexões: ${(i.conexoes||[]).join(', ')||'—'}
Próximo passo: ${i.proximo||'—'}
Notas: ${i.notas||'—'}${(i.reflexoes||[]).length ? '\nReflexões:\n'+i.reflexoes.map(r=>`• ${r.texto} (${formatarData(r.data)})`).join('\n') : ''}`;
        copiar(txt, ()=>toast('Ficha copiada ✓'));
      };

      const usarNosPrompts = (ideia) => { setIdeiaParaPrompt(ideia); setAba('prompts'); window.scrollTo({top:0,behavior:'smooth'}); };
      const verRefsDaIdeia = (ideia) => { setRefFiltroIdeia(ideia.id); setAba('refs'); window.scrollTo({top:0,behavior:'smooth'}); };

      const irIdeia = (i) => { setBuscaAberta(false); setAba('ideias'); setModal(i); };
      const irRef = (r) => { setBuscaAberta(false); setRefFiltroIdeia(null); setAba('refs'); setRefSeed(s=>({q:r.titulo||'', n:s.n+1})); window.scrollTo({top:0,behavior:'smooth'}); };
      const irLivro = (id) => { setBuscaAberta(false); setAba('livro'); setLivroSeed(s=>({id, n:s.n+1})); window.scrollTo({top:0,behavior:'smooth'}); };

      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); setBuscaAberta(true); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const exportar = () => {
        const backup = { tipo:'central-de-ideias-backup', versao:2, data:hojeISO(), ideias, livros, referencias:refs };
        const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `central-de-ideias-${hojeISO()}.json`;
        a.click(); URL.revokeObjectURL(url);
        toast('Backup exportado ✓');
      };

      const mesclar = (prev, novos) => {
        const ids = new Set(prev.map(i=>i.id));
        return [...(novos||[]).filter(d => d && d.id && !ids.has(d.id)), ...prev];
      };

      const importar = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const dados = JSON.parse(reader.result);
            if (Array.isArray(dados)) { // backup antigo (só ideias)
              setIdeias(prev => mesclar(prev, dados));
              toast(`${dados.length} ideia(s) importada(s) ✓`);
            } else if (dados && (dados.ideias || dados.livros || dados.referencias)) {
              setIdeias(prev => mesclar(prev, dados.ideias));
              setLivros(prev => mesclar(prev, dados.livros));
              setRefs(prev => mesclar(prev, dados.referencias));
              const n = (dados.ideias||[]).length, l = (dados.livros||[]).length, r = (dados.referencias||[]).length;
              toast(`Importado: ${n} ideia(s), ${l} livro(s), ${r} referência(s) ✓`);
            } else throw 0;
          } catch { toast('Arquivo inválido ✗'); }
        };
        reader.readAsText(file);
        e.target.value='';
      };

      const stats = useMemo(()=>({
        total: ideias.length,
        prontas: ideias.filter(i=>i.nivel==='pronta'||i.nivel==='publicada').length,
        pesquisa: ideias.filter(i=>i.nivel==='pesquisa').length,
      }), [ideias]);

      const tabBtn = (id, label) =>
        <button onClick={()=>setAba(id)} className={`shrink-0 whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold transition ${aba===id?'bg-brand-900 text-white shadow':'text-brand-600 hover:bg-brand-100'}`}>{label}</button>;

      return (
        <div className="min-h-screen">
          {/* HEADER */}
          <header className="bg-plum-800 text-white">
            <div className="max-w-6xl mx-auto px-5 py-6 sm:py-8">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="shrink-0 w-12 h-12 sm:w-16 sm:h-16 rounded-xl border-2 flex flex-col items-center justify-center font-serif leading-none" style={{borderColor:'#c9a44a', color:'#c9a44a'}}>
                    <span className="text-xl sm:text-2xl font-semibold tracking-tight">JP</span>
                  </div>
                  <div>
                    <h1 className="font-serif text-3xl sm:text-4xl">Central de Ideias</h1>
                    <p className="text-brand-100/80 mt-1 text-sm">Organize, aprofunde e transforme suas ideias — Jéssica Palin</p>
                  </div>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button onClick={()=>setTema(t=>t==='dark'?'light':'dark')} title="Alternar tema claro/escuro" className="px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-sm font-medium transition">{tema==='dark'?'☀️ Claro':'🌙 Escuro'}</button>
                  <button onClick={()=>setBuscaAberta(true)} className="px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-sm font-medium transition flex items-center gap-2">🔍 Buscar <kbd className="hidden sm:inline text-[10px] opacity-70 border border-white/30 rounded px-1">⌘K</kbd></button>
                  <button onClick={exportar} className="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-medium transition">Exportar backup</button>
                  <button onClick={()=>fileRef.current.click()} className="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-medium transition">Importar</button>
                  <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={importar} />
                </div>
              </div>

              <div className="mt-6 flex flex-wrap gap-x-6 gap-y-2 text-sm">
                <button onClick={()=>setAba('ideias')} className="text-left hover:opacity-80 transition"><span className="text-2xl font-bold">{stats.total}</span> <span className="text-brand-100/70">ideias</span></button>
                <div><span className="text-2xl font-bold">{stats.pesquisa}</span> <span className="text-brand-100/70">em pesquisa</span></div>
                <div><span className="text-2xl font-bold">{stats.prontas}</span> <span className="text-brand-100/70">prontas/publicadas</span></div>
                <button onClick={()=>setAba('refs')} className="text-left hover:opacity-80 transition"><span className="text-2xl font-bold">{refs.length}</span> <span className="text-brand-100/70">referências</span></button>
                <button onClick={()=>setAba('livro')} className="text-left hover:opacity-80 transition"><span className="text-2xl font-bold">{livros.length}</span> <span className="text-brand-100/70">livros</span></button>
              </div>
            </div>
          </header>

          {/* NAV */}
          <div className="sticky top-0 z-30 bg-brand-50/90 backdrop-blur border-b border-brand-200">
            <div className="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between gap-3">
              <div className="flex gap-2 overflow-x-auto no-scrollbar flex-1 min-w-0">
                {tabBtn('ideias','💡 Minhas Ideias')}
                {tabBtn('mentor','🧭 Mentor')}
                {tabBtn('prompts','✍️ Biblioteca de Prompts')}
                {tabBtn('refs','📚 Referências')}
                {tabBtn('livro','📖 Livro')}
              </div>
              {aba==='ideias' &&
                <button onClick={()=>setModal('nova')} className="shrink-0 bg-plum-600 hover:bg-plum-700 text-white font-semibold px-3 sm:px-4 py-2 rounded-xl transition shadow-sm whitespace-nowrap">+ Nova<span className="hidden sm:inline"> ideia</span></button>}
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-5 py-8">
            {aba==='ideias' ? (
              <>
                {/* LEMBRETES */}
                {lembretes.length>0 &&
                  <details open className="mb-5 bg-white rounded-2xl border border-brand-200 shadow-sm group">
                    <summary className="cursor-pointer list-none px-5 py-4 flex items-center justify-between select-none">
                      <span className="font-serif text-lg text-brand-900">
                        🔔 Próximos passos
                        {atrasados>0 && <span className="ml-2 text-sm font-sans text-red-600">· {atrasados} atrasado(s)</span>}
                      </span>
                      <span className="text-sm text-brand-400">{lembretes.length} ▾</span>
                    </summary>
                    <div className="px-5 pb-5 space-y-2">
                      <div className="flex flex-wrap gap-2 pb-1">
                        <button onClick={ativarLembretes} className="px-3 py-1.5 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">🔔 Ativar lembretes</button>
                        <button onClick={emailLembretes} className="px-3 py-1.5 rounded-lg border border-brand-200 text-brand-700 hover:bg-brand-100 transition text-sm">✉️ Enviar por e-mail</button>
                      </div>
                      {lembretes.map(i => {
                        const r = rotuloPrazo(i.prazo);
                        return (
                          <div key={i.id} className="flex items-center gap-2 rounded-xl border border-brand-100 hover:border-plum-300 px-2 py-1.5 transition">
                            <button onClick={()=>setModal(i)} className="flex-1 min-w-0 text-left flex items-center gap-3 px-1">
                              <Pill className={`shrink-0 ${r.cor}`}>{r.txt}</Pill>
                              <span className="text-sm text-brand-500 shrink-0 whitespace-nowrap">{formatarData(i.prazo)}</span>
                              <span className="flex-1 min-w-0 text-sm text-brand-800 font-medium truncate">{i.proximo || i.nome}</span>
                              <span className="text-xs text-brand-400 truncate ml-auto hidden sm:block">{i.nome}</span>
                            </button>
                            <button onClick={()=>baixarICS(i)} title="Adicionar ao calendário (.ics)" className="shrink-0 px-2 py-1 rounded-lg border border-brand-200 text-brand-600 hover:bg-brand-100 transition text-xs">📅</button>
                          </div>
                        );
                      })}
                    </div>
                  </details>}

                {/* ESTATÍSTICAS */}
                {ideias.length>0 &&
                  <details className="mb-5 bg-white rounded-2xl border border-brand-200 shadow-sm">
                    <summary className="cursor-pointer list-none px-5 py-4 flex items-center justify-between select-none">
                      <span className="font-serif text-lg text-brand-900">📊 Estatísticas por categoria</span>
                      <span className="text-sm text-brand-400">▾</span>
                    </summary>
                    <div className="px-5 pb-5 space-y-2">
                      {statsCat.map(s => (
                        <div key={s.id} className="flex items-center gap-3 text-sm">
                          <span className="w-36 sm:w-44 shrink-0 truncate text-brand-700">{s.emoji} {s.curto}</span>
                          <div className="flex-1 bg-brand-100 rounded-full h-2.5 overflow-hidden">
                            <div className="h-full bg-plum-500 rounded-full transition-all" style={{width:`${(s.n/maxCat)*100}%`}}></div>
                          </div>
                          <span className="w-6 text-right text-brand-600 font-medium">{s.n}</span>
                        </div>
                      ))}
                      <div className="pt-3 mt-2 border-t border-brand-100 flex flex-wrap gap-2">
                        {statsNivel.map(s => <Pill key={s.id} className={s.cor}>{s.nome}: {s.n}</Pill>)}
                      </div>
                    </div>
                  </details>}

                {/* FILTROS */}
                <div className="flex flex-wrap gap-3 mb-4 items-center">
                  <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar ideia..."
                    className="flex-1 min-w-[200px] rounded-xl border border-brand-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300" />
                  <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)}
                    className="rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
                    <option value="todas">Todas as categorias</option>
                    {CATEGORIAS.map(c=><option key={c.id} value={c.id}>{c.emoji} {c.curto}</option>)}
                  </select>
                  <select value={filtroNivel} onChange={e=>setFiltroNivel(e.target.value)}
                    className="rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
                    <option value="todos">Todos os níveis</option>
                    {NIVEIS.map(n=><option key={n.id} value={n.id}>{n.nome}</option>)}
                  </select>
                  {projetos.length>0 &&
                    <select value={filtroProjeto} onChange={e=>setFiltroProjeto(e.target.value)}
                      className="rounded-xl border border-brand-200 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
                      <option value="todos">Todos os projetos</option>
                      {projetos.map(p=><option key={p} value={p}>📁 {p}</option>)}
                    </select>}
                </div>

                {/* VISTA + AGRUPAMENTO */}
                <div className="flex flex-wrap gap-3 mb-6 items-center justify-between">
                  <div className="inline-flex rounded-xl border border-brand-200 bg-white p-1">
                    <button onClick={()=>setVista('cards')}
                      className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${vista==='cards'?'bg-brand-900 text-white':'text-brand-600 hover:bg-brand-100'}`}>🗂️ Cards</button>
                    <button onClick={()=>setVista('kanban')}
                      className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${vista==='kanban'?'bg-brand-900 text-white':'text-brand-600 hover:bg-brand-100'}`}>📋 Quadro (Kanban)</button>
                  </div>
                  {vista==='cards' ? (
                    <div className="flex items-center gap-2 text-sm text-brand-600">
                      <span>Agrupar por:</span>
                      <select value={agrupar} onChange={e=>setAgrupar(e.target.value)}
                        className="rounded-xl border border-brand-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-plum-300">
                        <option value="nenhum">Nenhum</option>
                        <option value="projeto">Projeto / subpasta</option>
                        <option value="categoria">Categoria</option>
                      </select>
                    </div>
                  ) : (
                    <span className="text-xs text-brand-400">Arraste os cards entre as colunas para mudar o nível.</span>
                  )}
                </div>

                {filtradas.length===0 ? (
                  <div className="text-center py-20 text-brand-500">
                    <p className="font-serif text-2xl mb-2">Nenhuma ideia aqui</p>
                    <p className="text-sm">Clique em <strong>+ Nova ideia</strong> para começar.</p>
                  </div>
                ) : vista==='kanban' ? (
                  <KanbanBoard ideias={filtradas} onEditar={setModal} onMover={moverNivel} />
                ) : (
                  <div className="space-y-8">
                    {grupos.map(g => (
                      <div key={g.chave}>
                        {g.titulo &&
                          <h3 className="font-serif text-xl text-brand-800 mb-4 flex items-center gap-2">
                            {g.titulo}<span className="text-sm text-brand-400">({g.itens.length})</span>
                          </h3>}
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                          {g.itens.map(i => (
                            <IdeiaCard key={i.id} ideia={i}
                              onEditar={setModal} onExcluir={excluir}
                              onUsarPrompt={usarNosPrompts} onCopiarFicha={copiarFicha}
                              onExportar={setExportarIdeia} onEnviarLivro={setEnviarLivro}
                              refsCount={refs.filter(r=>(r.ideiaIds||[]).includes(i.id)).length} onVerRefs={verRefsDaIdeia} />
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            ) : aba==='mentor' ? (
              <ChatMentor ideias={ideias} setIdeias={setIdeias} toast={toast} />
            ) : aba==='refs' ? (
              <ReferenciasTab refs={refs} setRefs={setRefs} ideias={ideias} copiar={copiar} toast={toast}
                filtroIdeia={refFiltroIdeia} setFiltroIdeia={setRefFiltroIdeia} seed={refSeed} />
            ) : aba==='livro' ? (
              <LivroTab livros={livros} setLivros={setLivros} ideias={ideias} toast={toast} abrir={livroSeed} />
            ) : (
              <>
                <div className="mb-6 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="font-serif text-2xl text-brand-900">Biblioteca de Prompts</h2>
                    <p className="text-sm text-brand-600">Os prompts da Jéssica para a Ely. Abra um, ajuste e copie.</p>
                  </div>
                  {ideiaParaPrompt && (
                    <div className="flex items-center gap-2 text-sm bg-plum-50 border border-plum-200 text-plum-800 rounded-xl px-3 py-2">
                      Ideia ativa: <strong>{ideiaParaPrompt.nome}</strong>
                      <button onClick={()=>setIdeiaParaPrompt(null)} className="ml-1 text-plum-500 hover:text-plum-700">✕</button>
                    </div>
                  )}
                </div>

                <div className="space-y-4">
                  <PromptCard prompt={PROMPT_MAE} ideia={ideiaParaPrompt} onCopiado={()=>toast('Prompt copiado ✓')} />
                  <div className="pt-2 text-xs font-semibold uppercase tracking-wide text-brand-500">Prompts por fase</div>
                  {PROMPTS.map(p => (
                    <PromptCard key={p.id} prompt={p} ideia={ideiaParaPrompt} onCopiado={()=>toast('Prompt copiado ✓')} />
                  ))}
                </div>
              </>
            )}
          </main>

          {/* MODAL */}
          {modal && (
            <div className="fixed inset-0 z-40 bg-brand-900/40 backdrop-blur-sm flex items-start justify-center p-4 overflow-auto" onClick={()=>setModal(null)}>
              <div className="bg-brand-50 rounded-2xl shadow-2xl max-w-2xl w-full my-8 p-6" onClick={e=>e.stopPropagation()} data-anim>
                <h2 className="font-serif text-2xl text-brand-900 mb-5">{modal==='nova'?'Nova ideia':'Editar ideia'}</h2>
                <FichaForm
                  inicial={modal==='nova'?null:modal}
                  onSalvar={salvarIdeia}
                  onCancelar={()=>setModal(null)}
                  projetos={projetos} />
              </div>
            </div>
          )}

          {/* MODAL EXPORTAR */}
          {exportarIdeia && (
            <div className="fixed inset-0 z-40 bg-brand-900/40 backdrop-blur-sm flex items-start justify-center p-4 overflow-auto" onClick={()=>setExportarIdeia(null)}>
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full my-8 p-6" onClick={e=>e.stopPropagation()} data-anim>
                <h2 className="font-serif text-2xl text-brand-900 mb-4">Exportar ideia</h2>
                <div id="folha-impressao" className="border border-brand-200 rounded-xl p-5 mb-4 bg-white">
                  <FolhaImpressao ideia={exportarIdeia} />
                </div>
                <div className="flex flex-wrap gap-3">
                  <button onClick={()=>window.print()} className="flex-1 min-w-[140px] bg-plum-600 hover:bg-plum-700 text-white font-semibold py-2.5 rounded-xl transition">Salvar como PDF</button>
                  <button onClick={()=>baixarTxt(exportarIdeia)} className="px-5 py-2.5 rounded-xl border border-brand-200 text-brand-700 hover:bg-brand-100 transition font-medium">Baixar .txt</button>
                  <button onClick={()=>copiar(textoExport(exportarIdeia), ()=>toast('Texto copiado ✓'))} className="px-5 py-2.5 rounded-xl border border-brand-200 text-brand-700 hover:bg-brand-100 transition font-medium">Copiar texto</button>
                  <button onClick={()=>setExportarIdeia(null)} className="px-4 py-2.5 rounded-xl text-brand-500 hover:bg-brand-100 transition">Fechar</button>
                </div>
                <p className="mt-3 text-xs text-brand-400">Para PDF: na janela de impressão escolha “Salvar como PDF / Destino: PDF”.</p>
              </div>
            </div>
          )}

          {/* BUSCA GLOBAL */}
          {buscaAberta && (
            <BuscaGlobal ideias={ideias} refs={refs} livros={livros}
              onFechar={()=>setBuscaAberta(false)}
              onIrIdeia={irIdeia} onIrRef={irRef} onIrLivro={irLivro} />
          )}

          {/* MODAL ENVIAR P/ LIVRO */}
          {enviarLivro && (
            <EnviarLivroModal ideia={enviarLivro} livros={livros} setLivros={setLivros}
              onFechar={()=>setEnviarLivro(null)} toast={toast} />
          )}

          <footer className="max-w-6xl mx-auto px-5 py-10 text-center text-xs text-brand-400">
            Seus dados ficam salvos apenas neste computador (neste navegador). Use <strong>Exportar backup</strong> regularmente.
          </footer>

          {toastNode}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
